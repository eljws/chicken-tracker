<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chicken metrics</title>
<style>
  :root {
    color-scheme: dark;
    --page: #141414; --surface: #1d1d1d; --border: rgba(255,255,255,0.10);
    --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835;
    /* hen colours: fixed per hen on every chart (validated for colour-blind separation in this order) */
    --Monster: #3987e5; --Ginger: #d95926; --Rocky: #199e70; --Salt: #c98500; --Pepper: #d55181;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 10px 18px; background: #1f1f1f; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 18px; }
  header a { color: var(--ink2); }
  .days { display: flex; gap: 6px; flex-wrap: wrap; }
  .days button { background: #2a2a2a; color: var(--ink2); border: 1px solid transparent; border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
  .days button.sel { border-color: var(--ink2); color: var(--ink); font-weight: 600; }
  main { padding: 14px 18px; display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(520px, 1fr)); }
  main.loading { opacity: .5; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; min-width: 0; }
  .card.wide { grid-column: 1 / -1; }
  .card h2 { margin: 0; font-size: 15px; }
  .card .sub { color: var(--muted); font-size: 12px; margin: 2px 0 8px; }
  .kpis { display: flex; gap: 28px; flex-wrap: wrap; }
  .kpi .v { font-size: 30px; font-weight: 600; }
  .kpi .l { color: var(--ink2); font-size: 12px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink2); margin-bottom: 4px; }
  .legend i { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 5px; border-radius: 1px; }
  .legend i.dot { width: 8px; height: 8px; border-radius: 50%; }
  svg { display: block; width: 100%; overflow: visible; }
  svg text { fill: var(--muted); font-size: 11px; }
  svg .lab { fill: var(--ink2); font-size: 12px; }
  svg .val { fill: var(--ink); font-size: 12px; }
  .hit { cursor: pointer; }
  #tip { position: fixed; pointer-events: none; background: #262625; border: 1px solid var(--border); border-radius: 6px;
         padding: 6px 9px; font-size: 12px; color: var(--ink2); display: none; z-index: 10; min-width: 120px; }
  #tip b { color: var(--ink); font-size: 13px; }
  #tip .row { display: flex; gap: 8px; align-items: center; }
  #tip .row i { width: 12px; height: 2px; display: inline-block; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 5px 8px; text-align: right; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
  th { color: var(--muted); font-weight: 500; }
  th:first-child, td:first-child { text-align: left; }
  .sw, td .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .empty { color: var(--muted); padding: 40px; }
  .muted { color: var(--muted); }
  h2.section { grid-column: 1 / -1; margin: 10px 0 -4px; font-size: 17px; }
  .split { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(260px, 1fr); gap: 18px; align-items: start; }
  .bf { display: flex; align-items: center; gap: 4px; padding: 3px 0; font-size: 13px; }
  .bf .nm { width: 70px; flex: none; }
  .bf .ab { flex: 1; height: 8px; margin: 0 8px; background: var(--grid); border-radius: 4px; overflow: hidden; max-width: 200px; }
  .bf .ab i { display: block; height: 100%; border-radius: 4px; }
  table.mx td.c { text-align: center; cursor: default; color: var(--ink); }
  table.mx td.self { background: repeating-linear-gradient(135deg, transparent 0 4px, #ffffff0a 4px 6px); }
  table.mx th { text-align: center; white-space: nowrap; }
  .evs { max-height: 260px; overflow-y: auto; font-size: 13px; }
  .evs .ev { padding: 3px 6px; border-radius: 4px; cursor: pointer; display: flex; gap: 4px; align-items: center; }
  .evs .ev:hover { background: #2a2a2a; }
</style>
</head>
<body>
<header>
  <h1>📊 Metrics</h1>
  <div class="days" id="days"></div>
  <span class="sub" id="cover" style="color:var(--muted)"></span>
  <a href="../timeline/" style="margin-left:auto">← timeline</a> <a href="../status/">status</a>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<div id="tip"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const css = getComputedStyle(document.documentElement);
const colour = h => css.getPropertyValue("--" + h).trim() || "#9a9a95";
const clock = s => { s = Math.round(s); return `${String(Math.floor(s / 3600)).padStart(2, "0")}:${String(Math.floor(s / 60) % 60).padStart(2, "0")}`; };
const clockS = s => clock(s) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
const NS = "http://www.w3.org/2000/svg";
let M = null, day = decodeURIComponent(location.hash.slice(1)) || "";

const tip = $("#tip");
function showTip(e, html) { tip.innerHTML = html; tip.style.display = "block";
  const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8), y = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8);
  tip.style.left = x + "px"; tip.style.top = y + "px"; }
function hideTip() { tip.style.display = "none"; }

function el(tag, attrs, parent) { const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; }
function txt(parent, x, y, s, cls, anchor = "start") { const t = el("text", { x, y, class: cls || "", "text-anchor": anchor }, parent); t.textContent = s; return t; }
// axis: 4-5 round ticks from 0 that just cover the data
const niceStep = v => { const p = 10 ** Math.floor(Math.log10(v)), f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; };
function axis(max, integer) { let step = niceStep(Math.max(max, 1e-9) / 4); if (integer) step = Math.max(1, Math.ceil(step));
  const n = Math.max(1, Math.ceil(max / step)); return { max: n * step, ticks: [...Array(n + 1).keys()].map(i => i * step) }; }

// ---------- horizontal bars: one per hen ----------
function bars(card, key, unit, fmt = v => v.toFixed(0), integer = false) {
  const W = card.clientWidth - 28, rowH = 30, left = 74, right = 70, H = M.hens.length * rowH + 22;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, height: H }, card);
  const ax = axis(Math.max(...M.hens.map(h => M.totals[h][key])), integer), max = ax.max, x = v => left + (W - left - right) * v / max;
  ax.ticks.forEach((v, i) => {
    el("line", { x1: x(v), x2: x(v), y1: 0, y2: H - 18, stroke: i ? "var(--grid)" : "var(--axis)" }, svg);
    txt(svg, x(v), H - 4, fmt(v), "", "middle"); });
  M.hens.forEach((h, i) => {
    const v = M.totals[h][key], y = i * rowH + 6, bw = Math.max(0, x(v) - left);
    txt(svg, left - 8, y + 13, h, "lab", "end");
    // 4px rounded data-end, square at the baseline
    const r = Math.min(4, bw / 2);
    el("path", { d: `M${left},${y} h${bw - r} a${r},${r} 0 0 1 ${r},${r} v${18 - 2 * r} a${r},${r} 0 0 1 ${-r},${r} h${-(bw - r)} z`, fill: colour(h) }, svg);
    txt(svg, left + bw + 6, y + 13, `${fmt(v)} ${unit}`, "val");
    const hit = el("rect", { x: 0, y: y - 4, width: W, height: rowH, fill: "transparent", class: "hit" }, svg);
    hit.onpointermove = e => showTip(e, `<b>${fmt(v)} ${esc(unit)}</b><br>${esc(h)}`);
    hit.onpointerleave = hideTip;
  });
}

// ---------- activity: metres per 10 min, one line per hen, gaps where there's no video ----------
function activity(card) {
  const bins = M.bins, step = M.bin_s;
  if (!bins.length) return;
  const W = card.clientWidth - 28, H = 240, L = 40, R = 12, T = 8, B = 24;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, height: H }, card);
  const t0 = bins[0], t1 = bins[bins.length - 1] + step;
  const ax = axis(Math.max(...M.hens.flatMap(h => M.activity[h]), 1)), max = ax.max;
  const x = t => L + (W - L - R) * (t - t0) / (t1 - t0), y = v => T + (H - T - B) * (1 - v / max);
  ax.ticks.forEach((v, i) => {
    el("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: i ? "var(--grid)" : "var(--axis)" }, svg);
    txt(svg, L - 6, y(v) + 4, v.toFixed(0), "", "end"); });
  const hourStep = (t1 - t0) > 6 * 3600 ? 7200 : 3600;
  for (let t = Math.ceil(t0 / hourStep) * hourStep; t <= t1; t += hourStep) txt(svg, x(t), H - 6, clock(t), "", "middle");
  // shade stretches with no processed video, so "flat" isn't mistaken for "resting"
  for (let i = 1; i < bins.length; i++) if (bins[i] - bins[i - 1] > step)
    el("rect", { x: x(bins[i - 1] + step), y: T, width: x(bins[i]) - x(bins[i - 1] + step), height: H - T - B, fill: "#ffffff08" }, svg);
  for (const h of M.hens) {
    let d = "";
    bins.forEach((b, i) => { const mid = b + step / 2, gap = i && bins[i] - bins[i - 1] > step;
      d += `${!i || gap ? "M" : "L"}${x(mid).toFixed(1)},${y(M.activity[h][i]).toFixed(1)}`; });
    el("path", { d, fill: "none", stroke: colour(h), "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
  }
  const hair = el("line", { y1: T, y2: H - B, stroke: "var(--ink2)", "stroke-width": 1, visibility: "hidden" }, svg);
  const dots = M.hens.map(h => el("circle", { r: 4, fill: colour(h), stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" }, svg));
  const hit = el("rect", { x: L, y: 0, width: W - L - R, height: H - B, fill: "transparent" }, svg);
  hit.onpointermove = e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width;
    const t = t0 + (px - L) / (W - L - R) * (t1 - t0);
    let i = 0; bins.forEach((b, k) => { if (Math.abs(b + step / 2 - t) < Math.abs(bins[i] + step / 2 - t)) i = k; });
    const cx = x(bins[i] + step / 2);
    hair.setAttribute("x1", cx); hair.setAttribute("x2", cx); hair.setAttribute("visibility", "visible");
    dots.forEach((c, k) => { c.setAttribute("cx", cx); c.setAttribute("cy", y(M.activity[M.hens[k]][i])); c.setAttribute("visibility", "visible"); });
    showTip(e, `<div style="margin-bottom:3px">${clock(bins[i])}–${clock(bins[i] + step)}</div>` +
      M.hens.map(h => `<div class="row"><i style="background:${colour(h)}"></i><b>${M.activity[h][i].toFixed(0)} m</b> ${esc(h)}</div>`).join(""));
  };
  hit.onpointerleave = () => { hideTip(); hair.setAttribute("visibility", "hidden"); dots.forEach(c => c.setAttribute("visibility", "hidden")); };
}

// ---------- runs: one row per hen, a dot per run at its time of day ----------
function runsChart(card) {
  const W = card.clientWidth - 28, rowH = 30, L = 110, R = 12, H = M.hens.length * rowH + 26;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, height: H }, card);
  const span = M.clips.length ? [M.clips[0].start_s, Math.max(...M.clips.map(c => c.end_s))] : [0, 86400];
  const t0 = Math.floor(span[0] / 3600) * 3600, t1 = Math.ceil(span[1] / 3600) * 3600;
  const x = t => L + (W - L - R) * (t - t0) / (t1 - t0);
  // processed video as a faint band behind each row, so an empty stretch reads as "no video" vs "no runs"
  for (const c of M.clips) el("rect", { x: x(c.start_s), y: 0, width: Math.max(1, x(c.end_s) - x(c.start_s)), height: H - 22, fill: "#ffffff0a" }, svg);
  const hourStep = (t1 - t0) > 6 * 3600 ? 7200 : 3600;
  for (let t = t0; t <= t1; t += hourStep) { el("line", { x1: x(t), x2: x(t), y1: 0, y2: H - 22, stroke: "var(--grid)" }, svg);
    txt(svg, x(t), H - 6, clock(t), "", "middle"); }
  const maxPeak = Math.max(...M.runs.map(r => r.peak_m_s), 1);
  M.hens.forEach((h, i) => {
    const cy = i * rowH + 15, mine = M.runs.filter(r => r.hen === h);
    el("line", { x1: L, x2: W - R, y1: cy, y2: cy, stroke: "var(--grid)" }, svg);
    txt(svg, L - 10, cy + 4, `${h} · ${mine.length}`, "lab", "end");
    for (const r of mine) {
      const c = el("circle", { cx: x(r.clock_s), cy, r: 4 + 3 * (r.peak_m_s - M.run_threshold_m_s) / Math.max(0.1, maxPeak - M.run_threshold_m_s),
                               fill: colour(h), stroke: "var(--surface)", "stroke-width": 2 }, svg);
      // 24px hit area, bigger than the dot
      const hit = el("circle", { cx: x(r.clock_s), cy, r: 12, fill: "transparent", class: "hit" }, svg);
      hit.onpointermove = e => { c.setAttribute("stroke", "var(--ink)");
        showTip(e, `<b>${r.peak_m_s.toFixed(1)} m/s</b> top speed<br>${esc(h)} · ${clockS(r.clock_s)}<br>` +
          `${r.duration_s.toFixed(1)} s · ${r.metres.toFixed(1)} m<br><span style="color:var(--muted)">click: watch it</span>`); };
      hit.onpointerleave = () => { c.setAttribute("stroke", "var(--surface)"); hideTip(); };
      hit.onclick = () => window.open(`../run/${r.run.split("/").map(encodeURIComponent).join("/")}/player/#t=${r.start_s.toFixed(1)}`, "_blank");
    }
  });
}

function table(card) {
  const cols = [["distance_m", "walked (m)", 0], ["m_per_min", "m / min seen", 1], ["visible_s", "seen (min)", 0, 1 / 60],
                ["runs", "runs", 0], ["top_speed_m_s", "top speed (m/s)", 1], ["water_visits", "water visits", 0],
                ["water_time_s", "at water (min)", 1, 1 / 60], ["pecks", "pecks", 0]];
  card.insertAdjacentHTML("beforeend", `<table><tr><th>hen</th>${cols.map(c => `<th>${c[1]}</th>`).join("")}</tr>` +
    M.hens.map(h => `<tr><td><span class="sw" style="background:${colour(h)}"></span>${esc(h)}</td>` +
      cols.map(([k, , d, f]) => `<td>${(M.totals[h][k] * (f || 1)).toFixed(d)}</td>`).join("") + "</tr>").join("") + "</table>");
}

// ================================================================ friends and relationships
const pct = v => v == null ? "–" : (100 * v).toFixed(0) + "%";
const mins = s => s >= 90 ? (s / 60).toFixed(0) + " min" : s + " s";
// one hue, light -> dark, for "how much" in the matrices (low values fade into the card)
const seq = v => `color-mix(in oklab, #3987e5 ${Math.round(8 + 82 * Math.min(1, Math.max(0, v)))}%, var(--surface))`;

// the flock as a ring: a line between two hens, thicker and brighter the more time they spend side by side
function network(card, S) {
  const W = Math.min(card.clientWidth - 28, 520), H = 330, cx = W / 2, cy = H / 2 + 4, R = Math.min(W, H) / 2 - 46;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, height: H, style: `max-width:${W}px` }, card);
  // ring order that puts the closest pairs next to each other, so the strong lines run round the edge, not across
  const sh = (a, b) => S.together_share[a][b] || 0;
  const perms = a => a.length < 2 ? [a] : a.flatMap((x, i) => perms([...a.slice(0, i), ...a.slice(i + 1)]).map(p => [x, ...p]));
  let ring = S.hens, best = -1;
  for (const p of S.hens.length <= 7 ? perms(S.hens.slice(1)) : [S.hens.slice(1)]) {
    const r = [S.hens[0], ...p], v = r.reduce((t, h, i) => t + sh(h, r[(i + 1) % r.length]), 0);
    if (v > best) { best = v; ring = r; } }
  const pos = {}; ring.forEach((h, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / S.hens.length; pos[h] = [cx + R * Math.cos(a), cy + R * Math.sin(a)]; });
  const top = Math.max(0.01, ...S.hens.flatMap(a => S.hens.filter(b => b !== a).map(b => S.together_share[a][b] || 0)));
  const pairs = []; S.hens.forEach((a, i) => S.hens.slice(i + 1).forEach(b => pairs.push([a, b, S.together_share[a][b] || 0])));
  pairs.sort((p, q) => p[2] - q[2]);
  for (const [a, b, v] of pairs) {
    const k = v / top, [x1, y1] = pos[a], [x2, y2] = pos[b];
    el("line", { x1, y1, x2, y2, stroke: "var(--ink2)", "stroke-width": 1 + 13 * k, "stroke-opacity": 0.12 + 0.75 * k, "stroke-linecap": "round" }, svg);
    if (k > 0.35) txt(svg, (x1 + x2) / 2, (y1 + y2) / 2 - 8, pct(v), "val", "middle");
    const hit = el("line", { x1, y1, x2, y2, stroke: "transparent", "stroke-width": 18, class: "hit" }, svg);
    hit.onpointermove = e => showTip(e, `<b>${esc(a)} & ${esc(b)}</b><br>side by side ${pct(v)} of the time both were on camera<br>` +
      `${mins(S.together[a][b])} of ${mins(S.covisible[a][b])}`);
    hit.onpointerleave = hideTip;
  }
  for (const h of S.hens) { const [x, y] = pos[h];
    el("circle", { cx: x, cy: y, r: 16, fill: colour(h), stroke: "var(--surface)", "stroke-width": 3 }, svg);
    const below = y > cy + 5;
    txt(svg, x, below ? y + 34 : y - 24, h, "lab", "middle"); }
}

// rows x columns, a number per cell, shaded by one hue
function matrix(card, S, get, fmt, tipf, rowsName, colsName) {
  const vals = S.hens.flatMap(a => S.hens.filter(b => b !== a).map(b => get(a, b) || 0)), top = Math.max(1e-9, ...vals);
  card.insertAdjacentHTML("beforeend", `<table class="mx"><tr><th>${rowsName ? `${rowsName} ↓ &nbsp; ${colsName} →` : ""}</th>${S.hens.map(h =>
    `<th><span class="sw" style="background:${colour(h)}"></span>${esc(h)}</th>`).join("")}</tr>` +
    S.hens.map(a => `<tr><td><span class="sw" style="background:${colour(a)}"></span>${esc(a)}</td>${S.hens.map(b => a === b ? `<td class="self"></td>` :
      `<td class="c" data-a="${esc(a)}" data-b="${esc(b)}" style="background:${seq((get(a, b) || 0) / top)}">${fmt(get(a, b))}</td>`).join("")}</tr>`).join("") + "</table>");
  card.querySelectorAll("td.c").forEach(td => { td.onpointermove = e => showTip(e, tipf(td.dataset.a, td.dataset.b)); td.onpointerleave = hideTip; });
}

function spreadChart(card, S) {
  const pts = Object.entries(S.spread).map(([b, v]) => [+b + M.bin_s / 2, v]);
  if (pts.length < 2) { card.insertAdjacentHTML("beforeend", `<div class="sub">Not enough video with three or more hens on camera.</div>`); return; }
  const W = card.clientWidth - 28, H = 200, L = 40, R = 12, T = 8, B = 24;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, height: H }, card);
  const t0 = Math.floor(pts[0][0] / 3600) * 3600, t1 = Math.ceil(pts[pts.length - 1][0] / 3600) * 3600;
  const ax = axis(Math.max(...pts.map(p => p[1]))), x = t => L + (W - L - R) * (t - t0) / (t1 - t0), y = v => T + (H - T - B) * (1 - v / ax.max);
  ax.ticks.forEach((v, i) => { el("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: i ? "var(--grid)" : "var(--axis)" }, svg);
    txt(svg, L - 6, y(v) + 4, v.toFixed(1), "", "end"); });
  const hs = (t1 - t0) > 6 * 3600 ? 7200 : 3600;
  for (let t = t0; t <= t1; t += hs) txt(svg, x(t), H - 6, clock(t), "", "middle");
  let d = ""; pts.forEach(([t, v], i) => { const gap = i && t - pts[i - 1][0] > M.bin_s * 1.5; d += `${!i || gap ? "M" : "L"}${x(t).toFixed(1)},${y(v).toFixed(1)}`; });
  el("path", { d, fill: "none", stroke: "var(--ink2)", "stroke-width": 2, "stroke-linejoin": "round" }, svg);
  for (const [t, v] of pts) { el("circle", { cx: x(t), cy: y(v), r: 4, fill: "var(--ink2)", stroke: "var(--surface)", "stroke-width": 2 }, svg);
    const hit = el("circle", { cx: x(t), cy: y(v), r: 12, fill: "transparent", class: "hit" }, svg);
    hit.onpointermove = e => showTip(e, `<b>${v.toFixed(2)} m</b> from the flock's centre, on average<br>${clock(t - M.bin_s / 2)}–${clock(t + M.bin_s / 2)}`);
    hit.onpointerleave = hideTip; }
}

// chasing: each chase on the day's clock (a row per chaser, the dot's middle in the chased hen's colour), who chases whom, and the list
function chasing(S) {
  const R = S.chase_rule || {}, ch = S.chases || [];
  const c = card("Chasing", `one hen hurries straight at another (both ≥ ${R.v} m/s, within ${R.gap_m} m, the chaser heading at her and she heading away) ` +
    `for ≥ ${R.min_s} s · hover a dot, click to watch it (a tracker mix-up can fake one, so check the surprising ones)`, true);
  if (!ch.length) { c.insertAdjacentHTML("beforeend", `<div class="sub">No chases seen this day.</div>`); return; }
  const given = h => ch.filter(e => e.a === h).length, got = h => ch.filter(e => e.b === h).length;
  const most = f => S.hens.slice().sort((a, b) => f(b) - f(a))[0];
  c.insertAdjacentHTML("beforeend", `<div class="kpis" style="margin-bottom:8px">
    <div class="kpi"><div class="v">${ch.length}</div><div class="l">chases</div></div>
    <div class="kpi"><div class="v">${esc(most(given))}</div><div class="l">chases most (${given(most(given))})</div></div>
    <div class="kpi"><div class="v">${esc(most(got))}</div><div class="l">chased most (${got(most(got))})</div></div></div>`);
  const W = c.clientWidth - 28, rowH = 28, L = 110, Rr = 12, H = S.hens.length * rowH + 26;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, height: H }, c);
  const span = M.clips.length ? [M.clips[0].start_s, Math.max(...M.clips.map(k => k.end_s))] : [0, 86400];
  const t0 = Math.floor(span[0] / 3600) * 3600, t1 = Math.ceil(span[1] / 3600) * 3600, x = t => L + (W - L - Rr) * (t - t0) / (t1 - t0);
  for (const k of M.clips) el("rect", { x: x(k.start_s), y: 0, width: Math.max(1, x(k.end_s) - x(k.start_s)), height: H - 22, fill: "#ffffff0a" }, svg);
  const hs = (t1 - t0) > 6 * 3600 ? 7200 : 3600;
  for (let t = t0; t <= t1; t += hs) { el("line", { x1: x(t), x2: x(t), y1: 0, y2: H - 22, stroke: "var(--grid)" }, svg); txt(svg, x(t), H - 6, clock(t), "", "middle"); }
  const open = e => window.open(`../run/${e.run.split("/").map(encodeURIComponent).join("/")}/player/#t=${Math.max(0, e.t - 2).toFixed(1)}`, "_blank");
  S.hens.forEach((h, i) => {
    const cy = i * rowH + 14;
    el("line", { x1: L, x2: W - Rr, y1: cy, y2: cy, stroke: "var(--grid)" }, svg);
    txt(svg, L - 10, cy + 4, `${h} · ${given(h)}`, "lab", "end");
    for (const e of ch.filter(e => e.a === h)) {
      const dot = el("circle", { cx: x(e.clock_s), cy, r: 6, fill: colour(e.b), stroke: colour(h), "stroke-width": 3 }, svg);
      const hit = el("circle", { cx: x(e.clock_s), cy, r: 12, fill: "transparent", class: "hit" }, svg);
      hit.onpointermove = ev => { dot.setAttribute("r", 8); showTip(ev, `<b>${esc(h)} chased ${esc(e.b)}</b><br>${clockS(e.clock_s)} · ${e.s} s · up to ${e.v.toFixed(1)} m/s<br><span style="color:var(--muted)">click: watch it</span>`); };
      hit.onpointerleave = () => { dot.setAttribute("r", 6); hideTip(); };
      hit.onclick = () => open(e);
    }
  });
  c.insertAdjacentHTML("beforeend", `<div class="sub" style="margin:6px 0 10px">a row per chaser · ring = the chaser's colour, middle = the hen being chased</div>`);
  const wrap = document.createElement("div"); wrap.className = "split"; c.appendChild(wrap);
  const left = document.createElement("div"); wrap.appendChild(left);
  matrix(left, S, (a, b) => S.chase_matrix[a][b], v => v ? v : "·", (a, b) => `<b>${esc(a)} chased ${esc(b)}</b> ${S.chase_matrix[a][b]}×<br>the other way: ${S.chase_matrix[b][a]}×`, "chaser", "chased");
  wrap.insertAdjacentHTML("beforeend", `<div class="evs">${ch.map((e, i) => `<div class="ev" data-c="${i}"><span class="muted">${clockS(e.clock_s)}</span>
    <span class="sw" style="background:${colour(e.a)}"></span>${esc(e.a)} <span class="muted">chased</span> <span class="sw" style="background:${colour(e.b)}"></span>${esc(e.b)}
    <span class="muted">· ${e.s} s · ${e.v.toFixed(1)} m/s ↗</span></div>`).join("")}</div>`);
  wrap.querySelectorAll("[data-c]").forEach(d => d.onclick = () => open(ch[+d.dataset.c]));
}

function social() {
  const S = M.social;
  if (!S || !S.hens || S.hens.length < 2) return;
  $("#main").insertAdjacentHTML("beforeend", `<h2 class="section">🤝 Friends and relationships</h2>`);
  const f = card("Who hangs out with whom", `line thickness = share of the time two hens are within ${S.close_m} m of each other, out of the time both are on camera ` +
    `(so a hen seen less isn't counted as less friendly) · hover a line for the numbers`, true);
  const wrap = document.createElement("div"); wrap.className = "split"; f.appendChild(wrap);
  const left = document.createElement("div"), right = document.createElement("div"); wrap.append(left, right);
  network(left, S);
  right.innerHTML = `<div class="sub" style="margin-top:0">Best friend: the hen she is most often nearest to</div>` + S.hens.map(h => { const b = S.best_friend[h];
    return `<div class="bf"><span class="sw" style="background:${colour(h)}"></span><b>${esc(h)}</b> <span class="muted">→</span> ${b ?
      `<span class="sw" style="background:${colour(b.hen)}"></span>${esc(b.hen)} <span class="muted">· nearest ${pct(b.share)} of the time</span>` : "–"}</div>`; }).join("") +
    `<div class="sub" style="margin-top:14px">On her own: share of her time with no hen within ${S.alone_m} m (while another hen is on camera)</div>` +
    S.hens.map(h => `<div class="bf"><span class="sw" style="background:${colour(h)}"></span><span class="nm">${esc(h)}</span><span class="ab"><i style="width:${(100 * (S.alone_share[h] || 0) / Math.max(0.01, ...S.hens.map(k => S.alone_share[k] || 0))).toFixed(0)}%;background:${colour(h)}"></i></span>${pct(S.alone_share[h])}</div>`).join("");

  matrix(card("Side by side", `% of the time both are on camera that they're within ${S.close_m} m · the same for both, so the table mirrors`), S,
    (a, b) => S.together_share[a][b], pct, (a, b) => `<b>${esc(a)} & ${esc(b)}</b><br>${pct(S.together_share[a][b])} · ${mins(S.together[a][b])} of ${mins(S.covisible[a][b])}`, "", "");
  matrix(card("Who follows whom", "seconds a hen walks where the other walked 2–4 s before (both moving) · read across: the row hen follows the column hen"), S,
    (a, b) => S.follows[a][b], v => v ? mins(v) : "·", (a, b) => `<b>${esc(a)} follows ${esc(b)}</b><br>${mins(S.follows[a][b])}<br>the other way: ${mins(S.follows[b][a])}`, "follower", "leader");

  const p = card("Pecking order", "a hen walks up to one standing still, and within 3 s that one moves away while she stays · " +
    "ranked by the share of these she won · click a moment to watch it (a tracker mix-up can fake one, so check)", true);
  const n = S.events.length;
  p.insertAdjacentHTML("beforeend", `<div class="split"><div><table><tr><th>rank</th><th>hen</th><th>moved others away</th><th>was moved away</th></tr>` +
    S.pecking_order.map((h, i) => `<tr><td>${i + 1}</td><td style="text-align:left"><span class="sw" style="background:${colour(h)}"></span>${esc(h)}</td><td>${S.wins[h]}</td><td>${S.losses[h]}</td></tr>`).join("") +
    `</table>${n < 30 ? `<div class="sub" style="margin-top:8px">Only ${n} such moment${n === 1 ? "" : "s"} this day: an early hint, it firms up over more days.</div>` : ""}</div>` +
    `<div class="evs">${S.events.map((e, i) => `<div class="ev" data-i="${i}"><span class="muted">${clockS(e.clock_s)}</span>
      <span class="sw" style="background:${colour(e.a)}"></span>${esc(e.a)} <span class="muted">moved</span> <span class="sw" style="background:${colour(e.b)}"></span>${esc(e.b)} <span class="muted">away ↗</span></div>`).join("") || '<span class="muted">none seen</span>'}</div></div>`);
  p.querySelectorAll(".ev").forEach(d => d.onclick = () => { const e = S.events[+d.dataset.i];
    window.open(`../run/${e.run.split("/").map(encodeURIComponent).join("/")}/player/#t=${Math.max(0, e.t - 3).toFixed(1)}`, "_blank"); });

  chasing(S);

  spreadChart(card("How close the flock keeps through the day", "average distance of each hen from the flock's centre, per 10 minutes (when 3+ hens are on camera) · lower = huddled together", true), S);
}

function card(title, sub, wide) {
  const c = document.createElement("div"); c.className = "card" + (wide ? " wide" : "");
  c.innerHTML = `<h2>${title}</h2><div class="sub">${sub}</div>`; $("#main").appendChild(c); return c;
}
const legend = (c, dot) => c.insertAdjacentHTML("beforeend", `<div class="legend">${M.hens.map(h =>
  `<span><i class="${dot ? "dot" : ""}" style="background:${colour(h)}"></i>${esc(h)}</span>`).join("")}</div>`);

function render() {
  const main = $("#main"); main.classList.remove("loading"); main.innerHTML = "";
  $("#days").innerHTML = M.days.map(d => `<button data-d="${d}" class="${d === M.day ? "sel" : ""}">${
    new Date(d + "T12:00").toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" })}</button>`).join("");
  document.querySelectorAll("#days button").forEach(b => b.onclick = () => { location.hash = b.dataset.d; });
  if (!M.hens || !M.hens.length) { main.innerHTML = `<div class="empty">No named clips on this day yet. Metrics appear once a clip is named
    (and its calibration is in place).</div>`; $("#cover").textContent = ""; return; }
  const mins = M.clips.reduce((s, c) => s + (c.end_s - c.start_s), 0) / 60;
  $("#cover").textContent = `${M.clips.length} named clip${M.clips.length > 1 ? "s" : ""} · ${Math.round(mins)} min of video · ` +
    M.clips.map(c => `${clock(c.start_s)}–${clock(c.end_s)}`).join(", ");
  const tot = k => M.hens.reduce((s, h) => s + M.totals[h][k], 0);
  const k = card("The day so far", "all hens together, over the named clips", true);
  k.insertAdjacentHTML("beforeend", `<div class="kpis">
    <div class="kpi"><div class="v">${Math.round(tot("distance_m"))} m</div><div class="l">walked</div></div>
    <div class="kpi"><div class="v">${tot("runs")}</div><div class="l">runs (≥ ${M.run_threshold_m_s} m/s)</div></div>
    <div class="kpi"><div class="v">${Math.round(tot("pecks"))}</div><div class="l">pecks${M.clips.some(c => !c.pecks) ?
      ` · counted in ${M.clips.filter(c => c.pecks).length} of ${M.clips.length} clips so far` : ""}</div></div>
    <div class="kpi"><div class="v">${Math.round(mins)} min</div><div class="l">video covered</div></div></div>`);
  bars(card("How far each hen walked", "metres, from her feet on the ground (box jitter smoothed out)"), "distance_m", "m");
  bars(card("How many times each hen ran", `bursts of ≥ ${M.run_threshold_m_s} m/s lasting ≥ 0.4 s`), "runs", "runs", v => v.toFixed(0), true);
  const a = card("Activity through the day", "metres walked per 10 minutes (a block only partly filmed is scaled up to 10 min) · lighter bands: no processed video", true);
  legend(a); activity(a);
  const r = card("Run events", "each dot is one run; bigger = faster · hover for details, click to watch it in the player " +
    "(a tracker mix-up between two hens can look like a dash, so check the surprising ones)", true);
  runsChart(r);
  table(card("All numbers", "the same figures as the charts, per hen", true));
  social();
}

async function load() {
  $("#main").classList.add("loading");
  M = await (await fetch("api" + (day ? `?day=${encodeURIComponent(day)}` : ""))).json();
  day = M.day; render();
}
addEventListener("hashchange", () => { day = decodeURIComponent(location.hash.slice(1)); load(); });
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => M && render(), 150); });
load();
</script>
</body>
</html>
