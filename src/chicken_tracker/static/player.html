<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chicken player</title>
<style>
  :root { --bg: #121212; --panel: #1c1c1c; --line: #2e2e2e; --text: #eaeaea; --muted: #9a9a9a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif;
         display: grid; grid-template-columns: 1fr 300px; grid-template-rows: auto 1fr auto; height: 100vh; }
  header { grid-column: 1 / -1; display: flex; gap: 14px; align-items: center; padding: 8px 14px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #clock { font-variant-numeric: tabular-nums; font-size: 18px; margin-left: auto; }
  #stage { position: relative; display: flex; align-items: center; justify-content: center; min-height: 0;
           min-width: 0; background: #000; }
  #wrap { position: relative; max-width: 100%; max-height: 100%; overflow: hidden; }
  #wrap.zoomed { cursor: grab; } #wrap.panning { cursor: grabbing; }
  video { display: block; max-width: 100%; max-height: calc(100vh - 170px); transform-origin: 0 0; }
  #pinfo { position: absolute; top: 8px; left: 8px; z-index: 3; background: rgba(0,0,0,.8); color: #eee; font-size: 13px;
            padding: 6px 10px; border-radius: 6px; border: 1px solid #fff; display: none; max-width: calc(100% - 30px); }
  #pinfo b.now { color: #fff; background: #c62828; padding: 0 5px; border-radius: 3px; }
  #pinfo button { background: #333; color: #eee; border: 1px solid #666; border-radius: 4px; padding: 2px 8px; margin-left: 6px; cursor: pointer; font-size: 12px; }
  #zoomtag { position: absolute; top: 6px; right: 8px; background: rgba(0,0,0,.65); color: #eee; font-size: 12px;
             padding: 2px 8px; border-radius: 4px; pointer-events: none; display: none; }
  #ov { position: absolute; inset: 0; pointer-events: none; }
  aside { background: var(--panel); border-left: 1px solid var(--line); overflow: auto; padding: 10px 12px;
          grid-row: 2 / 4; grid-column: 2; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 6px; }
  .hen { display: grid; grid-template-columns: 12px 1fr auto; gap: 8px; align-items: center; padding: 6px 8px;
         border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  .hen:hover { background: #262626; }
  .hen.on { border-color: #555; background: #262626; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .st { color: var(--muted); font-size: 12px; text-align: right; }
  .stats { grid-column: 2 / -1; color: var(--muted); font-size: 12px; display: none; }
  .hen.on .stats { display: block; }
  label.tg { display: flex; gap: 8px; align-items: center; padding: 3px 0; cursor: pointer; }
  .moment { display: flex; justify-content: space-between; padding: 4px 8px; border-radius: 6px; cursor: pointer; }
  .moment:hover { background: #262626; }
  footer { grid-column: 1; background: var(--panel); border-top: 1px solid var(--line); padding: 8px 14px; }
  #controls { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
  button { background: #2a2a2a; color: var(--text); border: 1px solid #444; border-radius: 6px; padding: 4px 10px;
           cursor: pointer; font-size: 13px; }
  button.on { background: #3a5a3a; border-color: #6a9a6a; }
  #tl { width: 100%; height: 70px; display: block; cursor: pointer; border-radius: 4px; }
  .keys { color: var(--muted); font-size: 12px; margin-left: auto; }
  kbd { background: #333; border: 1px solid #555; border-radius: 3px; padding: 0 4px; font-size: 11px; }
  #loading { position: absolute; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1 id="title">Chicken player</h1>
  <span id="info" style="color:var(--muted)"></span>
  <span id="clock">--:--:--</span>
</header>
<div id="stage">
  <span id="loading">Loading…</span>
  <div id="pinfo"></div>
  <div id="wrap">
    <video id="v" src="video.mp4" preload="auto" muted playsinline></video>
    <canvas id="ov"></canvas>
    <span id="zoomtag"></span>
  </div>
</div>
<aside>
  <h2>Chickens <span style="text-transform:none;letter-spacing:0">(click to highlight)</span></h2>
  <div id="hens"></div>
  <h2>Show</h2>
  <label class="tg"><input type="checkbox" data-layer="boxes" checked> Boxes &amp; names</label>
  <label class="tg"><input type="checkbox" data-layer="trails" checked> Trails (last 4 s)</label>
  <label class="tg"><input type="checkbox" data-layer="stations" checked> Feeder &amp; water</label>
  <label class="tg"><input type="checkbox" data-layer="hidden" checked> Hidden-chicken markers</label>
  <label class="tg"><input type="checkbox" data-layer="groups" checked> "2+ chickens" boxes (unnamed groups)</label>
  <label class="tg"><input type="checkbox" data-layer="pecks" checked> Pecks (pulse at the head)</label>
  <label class="tg" id="dotsTg" style="display:none"><input type="checkbox" data-layer="dots" checked> Dots: every hen, also where the detector loses her
    <span style="color:var(--muted)">(● seen · ◯ moving with her pixels · ? not seen, last seen here)</span></label>
  <label class="tg"><input type="checkbox" data-layer="skeletons"> Skeletons (beak → head → neck → back → tail)</label>
  <div id="illegalBox" style="display:none"><h2>Illegal moves <span id="illegalN" style="text-transform:none;letter-spacing:0"></span></h2>
  <div id="illegal" style="max-height:260px;overflow-y:auto"></div></div>
  <h2>Fastest moments</h2>
  <div id="moments"></div>
</aside>
<footer>
  <div id="controls">
    <button id="play">▶ Play</button>
    <span id="speeds"></span>
    <span class="keys"><kbd>space</kbd> play · <kbd>←</kbd><kbd>→</kbd> 5 s · <kbd>,</kbd><kbd>.</kbd> frame · scroll on the video = zoom, drag = move, double-click / <kbd>0</kbd> = back</span>
  </div>
  <canvas id="tl"></canvas>
</footer>
<script src="overlay.js"></script>
<script>
const v = document.getElementById("v"), ov = document.getElementById("ov"), ctx = ov.getContext("2d");
const tl = document.getElementById("tl"), tctx = tl.getContext("2d");
let D = null, focus = null, frame = 0;
const layers = { boxes: true, trails: true, stations: true, hidden: true, groups: true, skeletons: false, pecks: true, dots: true };
let DT = null;  // dots.json: {hens, dots: {hen: {x, y, src}}, illegal: [...]}
const ILL = { teleport: "⚡ jump", two_places: "⧉ two places", gap_jump: "↯ too far", flow_split: "⤨ went elsewhere", stacked: "◎ stacked" };
let P = null, pLoading = false;  // skeletons: loaded the first time the layer is switched on
function loadPoses() {
  if (P || pLoading) return; pLoading = true;
  fetch("poses.json").then(r => r.json()).then(d => { P = d; draw(); })
    .catch(() => { P = { frames: {} }; });
}
const ST_COL = { feeder: "#ff9800", water: "#29b6f6" }, ACT = { 1: "eating", 2: "drinking" };
const fmt = s => { s = Math.max(0, Math.floor(s)); return [s / 3600 | 0, (s % 3600) / 60 | 0, s % 60].map(x => String(x).padStart(2, "0")).join(":"); };

fetch("overlay.json").then(r => r.json()).then(d => {
  D = d;
  document.getElementById("info").textContent =
    `${d.chickens.length} chickens · ${d.width}×${d.height} analysed · ${d.fps.toFixed(2)} fps`;
  buildPanel(); buildTimeline(); resize(); draw();
  fetch("dots.json").then(r => r.ok ? r.json() : null).then(d => {
    if (!d || d.error) return;
    DT = d; DT.ci = Object.fromEntries(D.chickens.map((c, i) => [c.name, i]));
    document.getElementById("dotsTg").style.display = "block";
    document.getElementById("illegalBox").style.display = "block";
    document.getElementById("illegalN").textContent = `(${d.illegal.length})`;
    const box = document.getElementById("illegal");
    box.innerHTML = d.illegal.length ? d.illegal.map((e, k) => {
      const c = D.chickens[DT.ci[e.hen]] || { color: "#888" };
      return `<div class="moment ill" data-k="${k}" title="${e.detail.replace(/"/g, "&quot;")}"><span>
        <span class="dot" style="display:inline-block;background:${c.color}"></span>${e.hen} ${ILL[e.kind] || e.kind}</span>
        <span>${clockAt(e.from_frame / d.fps)}</span></div>`; }).join("")
      : '<span style="color:var(--muted)">none found</span>';
    box.querySelectorAll(".ill").forEach(el => el.onclick = () => { seek(DT.illegal[+el.dataset.k].from_frame / DT.fps - 1.5); v.play(); });
    draw();
  });
});

// ----------------------------------------------------------------- side panel
function buildPanel() {
  const hens = document.getElementById("hens");
  hens.innerHTML = D.chickens.map((c, i) => {
    const s = c.summary || {};
    const stats = [s.visible_s != null && `visible ${(s.visible_s / 60).toFixed(1)} min`,
      s.distance_m != null && `walked ${Math.round(s.distance_m)} m`,
      s.feeder_time_s != null && `feeder ${(s.feeder_time_s / 60).toFixed(1)} min (${s.feeder_visits} visits)`,
      s.pecks_at_feeder != null && `pecks: ${s.pecks_at_feeder} at feeder, ${s.pecks_ground} on the ground`,
      s.water_visits != null && `water ${s.water_visits} visits`,
      s.top_speed_m_s != null && `top speed ${s.top_speed_m_s} m/s`].filter(Boolean).join(" · ");
    return `<div class="hen" data-i="${i}"><span class="dot" style="background:${c.color}"></span>
      <b>${c.name}</b><span class="st" id="st${i}">—</span><div class="stats">${stats}</div></div>`;
  }).join("");
  hens.querySelectorAll(".hen").forEach(el => el.onclick = () => {
    const i = +el.dataset.i; focus = focus === i ? null : i;
    hens.querySelectorAll(".hen").forEach(h => h.classList.toggle("on", +h.dataset.i === focus));
    draw(); buildTimeline();
  });
  document.getElementById("moments").innerHTML = D.moments.length ? D.moments
    .sort((a, b) => b.speed - a.speed).map(m => `<div class="moment" data-t="${m.at}">
      <span><span class="dot" style="display:inline-block;background:${D.chickens[m.c].color}"></span>
      ${D.chickens[m.c].name}</span><span>${m.speed} m/s · ${clockAt(m.at)}</span></div>`).join("")
    : '<span style="color:var(--muted)">none</span>';
  document.querySelectorAll(".moment").forEach(el => el.onclick = () => { seek(+el.dataset.t - 1.5); v.play(); });
  document.querySelectorAll("input[data-layer]").forEach(cb => cb.onchange = () => {
    layers[cb.dataset.layer] = cb.checked;
    if (cb.dataset.layer === "skeletons" && cb.checked) loadPoses();
    draw();
  });
  document.getElementById("speeds").innerHTML = [0.5, 1, 2, 4, 8].map(r =>
    `<button data-r="${r}" class="${r === 1 ? "on" : ""}">${r}×</button>`).join(" ");
  document.querySelectorAll("#speeds button").forEach(b => b.onclick = () => {
    v.playbackRate = +b.dataset.r;
    document.querySelectorAll("#speeds button").forEach(x => x.classList.toggle("on", x === b));
  });
}
const clockAt = t => D && D.clock_start_s != null ? fmt(D.clock_start_s + t) : fmt(t);

// ------------------------------------------------------------- presence timeline
function buildTimeline() {
  if (!D) return;
  const W = tl.clientWidth * devicePixelRatio, H = tl.clientHeight * devicePixelRatio;
  tl.width = W; tl.height = H;
  const n = D.chickens.length, rowH = H / n, total = D.frames_total;
  tctx.fillStyle = "#181818"; tctx.fillRect(0, 0, W, H);
  const bins = Math.floor(W), seen = D.chickens.map(() => new Uint8Array(bins));
  for (const f in D.frames) {
    const a = D.frames[f], b = Math.min(bins - 1, Math.floor(+f / total * bins));
    for (let k = 0; k < a.length; k += 6) seen[a[k]][b] = 1;
  }
  D.chickens.forEach((c, i) => {
    tctx.fillStyle = c.color; tctx.globalAlpha = focus === null || focus === i ? 0.9 : 0.25;
    for (let x = 0; x < bins; x++) if (seen[i][x]) tctx.fillRect(x, i * rowH + 1, 1, rowH - 2);
  });
  tctx.globalAlpha = 1;
  if (PC) {  // the picture's stretch on the timeline
    const x1 = PC.a * D.fps / total * W, x2 = Math.max(x1 + 3, PC.b * D.fps / total * W);
    tctx.fillStyle = "rgba(255,255,255,.28)"; tctx.fillRect(x1, 0, x2 - x1, H);
    tctx.fillStyle = "#fff"; tctx.fillRect(x1, 0, 2, H); tctx.fillRect(x2 - 2, 0, 2, H);
  }
  tl._base = tctx.getImageData(0, 0, W, H);
}
function drawPlayhead() {
  if (!tl._base) return;
  tctx.putImageData(tl._base, 0, 0);
  const x = frame / D.frames_total * tl.width;
  tctx.fillStyle = "#fff"; tctx.fillRect(x - 1, 0, 2 * devicePixelRatio, tl.height);
}
tl.onclick = e => { const r = tl.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * D.frames_total / D.fps); };

// ------------------------------------------------------------------ overlay
function resize() {
  ov.width = v.clientWidth * devicePixelRatio; ov.height = v.clientHeight * devicePixelRatio;
  ov.style.width = v.clientWidth + "px"; ov.style.height = v.clientHeight + "px";
  typeof applyZoom === "function" && Z > 1 ? applyZoom() : draw();
}
// overlay size unit in canvas px: follows the video's size on screen, not the browser's page zoom
// (page zoom raises devicePixelRatio while the video stays the same size, which blew the text up)
const unit = () => Math.max(1, Math.min(devicePixelRatio, ov.width / 900));
window.addEventListener("resize", () => { resize(); buildTimeline(); });

// zoom into the video (scroll wheel or trackpad pinch on it); the overlay is drawn on top at screen
// resolution, so boxes, names and skeletons keep their normal size on screen however far you zoom
let Z = 1, TX = 0, TY = 0;  // zoom factor and pan (CSS px of the video box)
const wrap = document.getElementById("wrap"), ztag = document.getElementById("zoomtag");
function applyZoom() {
  const w = v.clientWidth, h = v.clientHeight;
  TX = Math.min(0, Math.max(w - w * Z, TX)); TY = Math.min(0, Math.max(h - h * Z, TY));
  v.style.transform = Z === 1 ? "" : `translate(${TX}px, ${TY}px) scale(${Z})`;
  wrap.classList.toggle("zoomed", Z > 1);
  ztag.style.display = Z > 1 ? "block" : "none"; ztag.textContent = `${Z.toFixed(1)}× · double-click to reset`;
  draw();
}
function zoomAt(px, py, nz) {
  nz = Math.max(1, Math.min(10, nz));
  TX = px - (px - TX) * nz / Z; TY = py - (py - TY) * nz / Z; Z = nz;
  if (Z < 1.02) { Z = 1; TX = TY = 0; }
  applyZoom();
}
wrap.addEventListener("wheel", e => {
  e.preventDefault();  // zoom the video, not the whole page
  const r = wrap.getBoundingClientRect(), d = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
  zoomAt(e.clientX - r.left, e.clientY - r.top, Z * Math.exp(-d * (e.ctrlKey ? 0.01 : 0.0015)));
}, { passive: false });
wrap.addEventListener("dblclick", () => { Z = 1; TX = TY = 0; applyZoom(); });
wrap.addEventListener("mousedown", e => {
  if (Z === 1 || e.button !== 0) return;
  e.preventDefault(); wrap.classList.add("panning");
  const x0 = e.clientX - TX, y0 = e.clientY - TY;
  const move = m => { TX = m.clientX - x0; TY = m.clientY - y0; applyZoom(); };
  const up = () => { wrap.classList.remove("panning"); removeEventListener("mousemove", move); removeEventListener("mouseup", up); };
  addEventListener("mousemove", move); addEventListener("mouseup", up);
});
v.addEventListener("loadedmetadata", () => {
  document.getElementById("loading").remove(); resize();
  const t = /[#&]t=([\d.]+)/.exec(location.hash);  // player/#t=123.4 opens a moment (e.g. a run from Metrics)
  if (t) seek(Math.max(0, +t[1] - 2));
  loadPiece();
});

// opened from a picture (checks, Hens page): point out that piece - where (white box) and when (banner + timeline band)
let PC = null;
async function loadPiece() {
  const q = new URLSearchParams(location.hash.slice(1)), n = q.get("piece");
  if (!n) return;
  while (!D) await new Promise(r => setTimeout(r, 100));
  try {
    const r = await fetch(`piece/${n}.json`); if (!r.ok) throw 0;
    const p = await r.json(), at = {};
    p.frames.forEach((f, i) => at[f] = p.boxes[i]);
    const fps = D.fps;
    PC = { ...p, at, name: q.get("name") || "",
           a: q.get("a") != null ? +q.get("a") : p.frames[0] / fps, b: q.get("b") != null ? +q.get("b") : p.frames[p.frames.length - 1] / fps };
    buildTimeline(); draw();
  } catch { const el = document.getElementById("pinfo"); el.style.display = "block";
    el.textContent = `Piece #${n} isn't in this clip's naming any more (it may have been cut or merged).`; }
}
function pieceBoxNear(f) {  // its box at frame f, or the nearest one within 3 s before/after
  if (PC.at[f]) return [PC.at[f], 0];
  const fr = PC.frames, w = 3 * D.fps;
  if (f < fr[0] && fr[0] - f <= w) return [PC.at[fr[0]], 1];
  if (f > fr[fr.length - 1] && f - fr[fr.length - 1] <= w) return [PC.at[fr[fr.length - 1]], -1];
  let lo = 0, hi = fr.length - 1;  // inside a gap in the piece: the frame just before
  while (lo < hi) { const m = (lo + hi + 1) >> 1; fr[m] <= f ? lo = m : hi = m - 1; }
  return fr[lo] <= f && f - fr[lo] <= w && f <= fr[fr.length - 1] ? [PC.at[fr[lo]], 2] : [null, 0];
}
function pieceBanner(t) {
  const el = document.getElementById("pinfo"); if (!PC) return;
  const st = t < PC.a ? `starts in <b>${(PC.a - t).toFixed(1)} s</b>` : t <= PC.b ? `<b class="now">● NOW</b> — the white box`
           : `ended <b>${(t - PC.b).toFixed(1)} s</b> ago`;
  const html = `📍 The picture's piece: <b>#${PC.track}${PC.name ? " " + PC.name.replace(/[<&]/g, "") : ""}</b> · ${clockAt(PC.a)}–${clockAt(PC.b)} · ${st}
    <button id="pplay">⟲ play it</button><button id="pzoom">🔍 zoom to it</button><button id="pclose">✕</button>`;
  if (el._h === html) return;
  el._h = html; el.innerHTML = html; el.style.display = "block";
  document.getElementById("pplay").onclick = () => { seek(PC.a - 2); v.play(); };
  document.getElementById("pzoom").onclick = () => {
    const [bx] = pieceBoxNear(frame); const b = bx || PC.boxes[0], k = v.clientWidth / D.width;
    if (!bx) seek(PC.frames[0] / D.fps);
    Z = 1; TX = TY = 0; zoomAt((b[0] + b[2]) / 2 * k, (b[1] + b[3]) / 2 * k, 3);
    // after zooming at the box, move it to the middle of the view
    TX += v.clientWidth / 2 - ((b[0] + b[2]) / 2 * k * Z + TX); TY += v.clientHeight / 2 - ((b[1] + b[3]) / 2 * k * Z + TY); applyZoom();
  };
  document.getElementById("pclose").onclick = () => { PC = null; el.style.display = "none"; el._h = ""; buildTimeline(); draw(); };
}

function boxesAt(f) {
  const a = D.frames[f]; const out = [];
  if (a) for (let k = 0; k < a.length; k += 6) out.push({ c: a[k], b: [a[k + 1], a[k + 2], a[k + 3], a[k + 4]], st: a[k + 5] });
  return out;
}

function pieceBox(s, u, lw, fs, label) {
  if (!PC) return;
  {
    const [bx, kind] = pieceBoxNear(frame);
    if (bx) {
      const [x1, y1, x2, y2] = bx.map(q => q * s), g = 4 * u;
      ctx.setLineDash(kind ? [5 * u, 4 * u] : []); ctx.globalAlpha = kind ? 0.7 : 1;
      ctx.lineWidth = lw * 3; ctx.strokeStyle = "#000"; ctx.strokeRect(x1 - g, y1 - g, x2 - x1 + 2 * g, y2 - y1 + 2 * g);
      ctx.lineWidth = lw * 1.6; ctx.strokeStyle = "#fff"; ctx.strokeRect(x1 - g, y1 - g, x2 - x1 + 2 * g, y2 - y1 + 2 * g);
      ctx.setLineDash([]);
      label(kind === 1 ? "▼ appears here soon" : kind === -1 ? "▼ was here" : kind === 2 ? "▼ the piece (hidden a moment)" : "▼ the picture's piece",
            x1 - g, y1 - g - 4 * u - (layers.boxes ? fs + 4 * u : 0), "#fff", kind ? 0.8 : 1);
      ctx.globalAlpha = 1;
    }
  }
}

function draw() {
  if (!D) return;
  const W = ov.width, s = W / D.width, t = frame / D.fps;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, ov.width, ov.height);
  const k = ov.width / (v.clientWidth || 1);  // canvas px per CSS px
  ctx.setTransform(Z, 0, 0, Z, TX * k, TY * k);  // zoomed: positions follow the video, sizes are divided back
  const u = unit() / Z, lw = 2 * u, fs = 13 * u;
  ctx.font = `600 ${fs}px system-ui`; ctx.lineJoin = "round";
  const alpha = i => focus === null || focus === i ? 1 : 0.25;
  const label = (txt, x, y, col, a) => {
    ctx.globalAlpha = a; ctx.lineWidth = 2 * u; ctx.strokeStyle = "rgba(0,0,0,.85)"; ctx.strokeText(txt, x, y);
    ctx.fillStyle = col; ctx.fillText(txt, x, y); ctx.globalAlpha = 1;
  };
  const res = CO.draw(ctx, { D, P, DT, frame, layers, focus, s, u, U: unit(), warnY: ov.height - 12 * unit(), before: pieceBox });
  const status = res.status;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (PC) pieceBanner(t);
  status.forEach((st, i) => { const el = document.getElementById("st" + i); if (el && el.textContent !== st) el.textContent = st; });
  document.getElementById("clock").textContent = clockAt(t);
  drawPlayhead();
}


// ------------------------------------------------------------ frame sync
function setFrame(mediaTime) { if (!D) return; frame = Math.round(mediaTime * D.fps); draw(); }
if ("requestVideoFrameCallback" in HTMLVideoElement.prototype) {
  const onFrame = (_, md) => { setFrame(md.mediaTime); v.requestVideoFrameCallback(onFrame); };
  v.requestVideoFrameCallback(onFrame);
} else {
  const loop = () => { setFrame(v.currentTime); requestAnimationFrame(loop); }; loop();
}
v.addEventListener("seeked", () => setFrame(v.currentTime));

// ---------------------------------------------------------------- controls
function seek(t) { v.currentTime = Math.max(0, Math.min(v.duration || 1e9, t)); }
const playBtn = document.getElementById("play");
playBtn.onclick = () => v.paused ? v.play() : v.pause();
v.addEventListener("play", () => playBtn.textContent = "❚❚ Pause");
v.addEventListener("pause", () => playBtn.textContent = "▶ Play");
window.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  const fd = D ? 1 / D.fps : 0.064;
  if (e.key === " ") { e.preventDefault(); playBtn.click(); }
  else if (e.key === "ArrowRight") seek(v.currentTime + 5);
  else if (e.key === "ArrowLeft") seek(v.currentTime - 5);
  else if (e.key === ".") { v.pause(); seek(v.currentTime + fd); }
  else if (e.key === ",") { v.pause(); seek(v.currentTime - fd); }
  else if (e.key === "0") { Z = 1; TX = TY = 0; applyZoom(); }
});
</script>
