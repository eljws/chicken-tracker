<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Who's who — chickens</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #141414; color: #eee; font: 14px/1.4 system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; gap: 10px; align-items: center;
           padding: 10px 16px; background: #1f1f1f; border-bottom: 1px solid #333; }
  .tab { background: none; border: 0; color: #aaa; font-size: 15px; padding: 6px 10px; cursor: pointer;
         border-bottom: 2px solid transparent; }
  .tab.on { color: #fff; border-color: #4caf50; }
  button.act { background: #2d2d2d; color: #eee; border: 1px solid #555; border-radius: 6px; padding: 6px 12px;
               cursor: pointer; font-size: 14px; }
  button.act:hover { background: #3a3a3a; }
  button.yes { background: #2e7d32; border-color: #4caf50; }
  button.no { background: #8e2b2b; border-color: #e57373; }
  .right { margin-left: auto; color: #999; }
  main { padding: 16px; }
  .card { background: #1d1d1d; border: 1px solid #333; border-radius: 10px; padding: 12px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 8px; display: flex; gap: 10px; align-items: center; font-weight: 500; }
  .card input { background: #111; color: #fff; border: 1px solid #555; border-radius: 6px; padding: 6px 10px;
                font-size: 16px; width: 200px; }
  .card input.unnamed { border-color: #ffc107; }
  .meta { color: #999; font-size: 13px; }
  select { background: #111; color: #eee; border: 1px solid #555; border-radius: 6px; padding: 5px; }
  .strip { display: flex; flex-wrap: wrap; gap: 6px; }
  .strip img { width: 84px; height: 84px; object-fit: contain; background: #000; border-radius: 6px; border: 2px solid transparent;
               cursor: pointer; }
  .strip img.sure { border-color: #4caf50; }
  .strip img.partial { border-style: dashed; border-color: #ffb74d; }
  .strip img.loose { border-style: dotted; border-color: #64b5f6; }
  .strip img.sel { border-color: #ffc107; outline: 2px solid #ffc107; }
  #panel { position: fixed; right: 16px; bottom: 16px; width: 560px; max-height: 80vh; overflow: auto; background: #262626; border: 1px solid #555;
           border-radius: 10px; padding: 12px; display: none; z-index: 10; }
  #panel > img { width: 160px; border-radius: 6px; }
  #panel .opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .q { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .q h2 { margin: 0 0 6px; font-size: 26px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .grid img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #000; border-radius: 6px; }
  .answers { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; align-items: center; }
  kbd { background: #333; border: 1px solid #555; border-radius: 4px; padding: 0 5px; font-size: 12px; }
  .hint { color: #aaa; margin-bottom: 14px; }
  .film { display: flex; flex-wrap: wrap; align-items: center; row-gap: 6px; margin: 6px 0; }
  .film img { border-radius: 4px; background: #000; }
  .cut { align-self: stretch; width: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer;
         color: #666; font-size: 13px; border-radius: 4px; }
  .cut:hover { color: #111; background: #ffc107; }
  .gap { width: 4px; }
  .brushes { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .brush { border-left: 6px solid var(--bc) !important; }
  .spd.on { outline: 2px solid #ffc107; }
  .trow { display: flex; align-items: center; gap: 4px; overflow-x: auto; padding-bottom: 4px; }
  .tcard { background: #262626; border: 2px solid #3a3a3a; border-radius: 6px; padding: 4px; font-size: 12px; min-width: 120px; max-width: 170px; }
  .tcard.sure { border-color: #4caf50; } .tcard.amb { border-color: #ffb74d; } .tcard.me { border-color: #ffd54f; }
  .tcard img { max-width: 100%; border-radius: 4px; } .tcard .warn { color: #ffb74d; }
  .tarrow { color: #888; font-size: 18px; }
  .where { background: #202020; border: 1px solid #333; border-radius: 8px; padding: 8px 10px; margin: 8px 0 12px; }
  .whead { font-weight: 600; margin-bottom: 6px; } .wverdict { font-weight: 400; color: #ddd; margin-left: 6px; }
  .wrows { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px; }
  .wrow { background: #262626; border-radius: 6px; padding: 5px 8px; font-size: 13px; } .wrow.no { opacity: .55; }
  .wrow .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
  .wwhy { font-size: 12px; margin-top: 2px; line-height: 1.4; } .wwhy .hit { color: #8bd48b; }
  .wtag { font-size: 11px; padding: 1px 6px; border-radius: 8px; background: #333; color: #bbb; }
  .wmode.on { outline: 2px solid #ffc107; color: #fff; }
  .wtag.yes { background: #1f4d2a; color: #9be39b; } .wtag.near { background: #3d3a1f; color: #e0d68a; }
  .wwhy .weak { color: #d8cf8a; } .wtag.no { background: #4d1f1f; color: #f0a0a0; }
  .where a { color: #8ab4f8; }
  .where .warn { color: #ffb74d; font-size: 13px; margin-bottom: 4px; }
  .brush.on { background: #4a4a4a; outline: 2px solid var(--bc); color: #fff; font-weight: 600; }
  .paint { gap: 4px; user-select: none; }
  .paint .pic { position: relative; cursor: crosshair; border: 3px solid var(--mc, transparent); border-radius: 6px; }
  .paint .pic img { display: block; }
  .paint .pic .tag { position: absolute; left: 0; right: 0; bottom: 0; font-size: 11px; text-align: center; color: #fff;
                     background: color-mix(in srgb, var(--mc) 85%, transparent); white-space: nowrap; overflow: hidden; }
  .paint .pic:not(.marked) .tag { display: none; }
  .paint .pic.bpartial { border-style: dashed; } .paint .pic.bloose { border-style: dotted; }
  .brushes .lbl { align-self: center; color: #aaa; font-size: 12px; min-width: 52px; }
  .brush.box { border-left-color: #888 !important; }
  #zoom { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 50; align-items: center; justify-content: center; }
  #zoom .zbox { background: #1d1d1d; border: 1px solid #444; border-radius: 8px; padding: 12px; max-width: 96vw; overflow-x: auto; }
  #zoom h3 { display: flex; gap: 10px; align-items: center; margin: 0 0 8px; }
  #toast { z-index: 60; position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #333; padding: 8px 16px;
           border-radius: 6px; opacity: 0; transition: opacity .3s; }
</style>
</head>
<body>
<header>
  <button class="tab on" data-tab="name">1 · Name &amp; merge</button>
  <button class="tab" data-tab="ask">2 · Questions <span id="qcount"></span></button>
  <button class="tab" data-tab="conflicts">3 · Conflicts <span id="ccount"></span></button>
  <button class="tab" data-tab="checks">4 · Checks <span id="kcount"></span></button>
  <button class="act" id="undo" disabled>↶ Undo</button>
  <button class="act" id="resort" title="Re-sort unconfirmed pieces against your named chickens">↻ Re-sort pieces</button>
  <span class="right" id="status"></span>
</header>
<main id="main"></main>
<div id="panel"></div>
<div id="toast"></div>
<script>
const TABS = ["name", "ask", "conflicts", "checks"];
let S = null, tab = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "name", sel = null;  // #ask opens Questions
const $ = s => document.querySelector(s);
const label = c => c.name || `Chicken ${c.id + 1}`;
const img = n => `crop/${encodeURIComponent(n)}`;

async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" },
                                       body: JSON.stringify(body) } : {});
  let j;
  try { j = await r.json(); } catch (e) { toast(`Something went wrong (${r.status}) — see the server window`, 5000); return false; }
  if (j.error) { toast(j.error, 5000); return false; }
  S = j; render(); return true;
}
const clockOf = s => { const t = Math.round(s); return `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`; };
// filmstrip of a piece across its whole life; ✂ between frames cuts the piece there
function film(p, h = 120, cuttable = true, zoomed = false) {
  return `<div class="film">${p.strip.map((f, i) =>
    (i ? (cuttable ? `<span class="cut" data-t="${p.track}" data-f0="${p.strip[i - 1]}" data-f="${f}" ${zoomed ? 'data-direct="1"' : ""}
       title="${zoomed ? "cut here" : "cut piece here (zooms in first if the pictures are far apart)"}">✂</span>` : '<span class="gap"></span>') : "") +
    `<img src="strip/${p.track}/${f}.jpg?v=${S.version}${zoomed ? "&wide=1" : ""}" style="height:${h}px">`).join("")}</div>`;
}
// ✂ between two pictures: if they're more than a couple of frames apart, the bird changed somewhere
// in between, so zoom into that gap first (and again) until the cut lands on the right frame.
let cutting = false;
function bindCuts(root = document) {
  root.querySelectorAll(".cut").forEach(c => c.onclick = () => cutAt(+c.dataset.t, +c.dataset.f0, +c.dataset.f, !!c.dataset.direct));
}
async function cutAt(t, f0, f, direct) {  // zoom once (from the main filmstrip), never again inside the zoom
  if (cutting) return toast("Still cutting — one moment…");
  if (!direct) {
    const g = await (await fetch(`api/gap/${t}/${f0}/${f}`)).json();
    if (g.frames && g.frames.length > 3) return showGap(t, g.frames);
  }
  closeGap();
  if (!confirm(`Cut piece #${t} at ${clockOf(f / S.fps)}?\n\nEverything from this frame on becomes a new piece, ` +
               `so you can label the two halves separately.`)) return;
  cutting = true; toast("Cutting… (extracting new pictures)", 60000); sel = null;
  try { if (await api("api/split", { track: t, frame: f })) toast("Cut ✂ — label each half"); }
  finally { cutting = false; }
}
function showGap(t, frames) {
  let z = $("#zoom");
  if (!z) { z = document.createElement("div"); z.id = "zoom"; document.body.appendChild(z); }
  const secs = ((frames[frames.length - 1] - frames[0]) / S.fps).toFixed(1);
  z.innerHTML = `<div class="zbox"><h3>Where does it change? <span class="meta">piece #${t}, ${clockOf(frames[0] / S.fps)}–${clockOf(frames[frames.length - 1] / S.fps)}
      (${secs}s between the two pictures you picked) · click ✂ where the bird changes — if you can't see it, a
      cut anywhere in the middle is fine, or close and answer "can't tell which hen"</span>
      <button class="act" id="zclose" style="margin-left:auto">close</button></h3>
    ${film({ track: t, strip: frames }, 200, true, true)}</div>`;
  z.style.display = "flex";
  z.querySelector("#zclose").onclick = closeGap;
  z.onclick = e => { if (e.target === z) closeGap(); };
  bindCuts(z);
}
function closeGap() { const z = $("#zoom"); if (z) z.style.display = "none"; }
function toast(m, ms = 1400) { const t = $("#toast"); t.textContent = m; t.style.opacity = 1; clearTimeout(t._t);
                    t._t = setTimeout(() => t.style.opacity = 0, ms); }

function render() {
  $("#qcount").textContent = `(${S.questions})`;
  const u = $("#undo");
  u.disabled = !S.undo.count;
  u.title = S.undo.count ? `Undo: ${S.undo.label}  (⌘Z · ${S.undo.count} steps saved)` : "Nothing to undo";
  $("#ccount").innerHTML = S.conflicts ? `<b style="color:#ff7961">(${S.conflicts})</b>` : "(0)";
  $("#kcount").innerHTML = S.checks ? `<b style="color:#ffb74d">(${S.checks})</b>` : "(0)";
  const unnamed = S.chickens.filter(c => !c.name).length;
  const todo = S.questions + S.conflicts + S.checks;
  $("#status").innerHTML = (todo ? `<b style="color:#ffb74d">${todo} to review</b> · ` : `<b style="color:#81c784">all reviewed ✓</b> · `) +
    `${S.chickens.length} chickens · ${unnamed} unnamed · ${S.answered} answers`;
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  tab === "name" ? renderName() : tab === "ask" ? renderAsk() : tab === "conflicts" ? renderConflicts() : renderChecks();
}

function renderName() {
  const opts = S.chickens.map(c => `<option value="${c.id}">${esc(label(c))}</option>`).join("");
  $("#main").innerHTML = `<div class="hint">Give each group its chicken's name. If two groups are the same bird,
    merge them. Click a picture that's in the wrong group to move it. Green border = confirmed by you,
    dashed orange = only part of the bird, dotted blue = box a bit too big.</div>` +
    S.chickens.map(c => `
    <div class="card"><h3>
      <input data-id="${c.id}" class="${c.name ? "" : "unnamed"}" value="${esc(c.name)}" placeholder="Chicken ${c.id + 1} — type name">
      ${c.fragments.some(f => !f.sure) ? `<button class="act yes" data-all="${c.id}"
         title="Every picture in this row is ${esc(label(c))}: confirm the ones not yet confirmed">✓ all match</button>` : ""}
      <span class="meta">${c.fragments.length} pieces · ${c.fragments.filter(f => f.sure).length} confirmed · ${c.minutes} min seen</span>
      <span style="margin-left:auto" class="meta">same bird as</span>
      <select data-merge="${c.id}"><option value="">—</option>${opts.replace(`value="${c.id}"`, `value="${c.id}" disabled`)}</select>
    </h3>
    <div class="strip">${c.fragments.map(f => `<img src="${img(f.crop)}" data-t="${f.track}" data-c="${c.id}"
       class="${f.sure ? "sure" : ""} ${f.flag || ""} ${sel && sel.track === f.track ? "sel" : ""}"
       title="piece #${f.track}${f.flag === "partial" ? " (only part of the bird)" : f.flag === "loose" ? " (box a bit too big)" : ""}">`).join("")}</div>
    </div>`).join("") + [["multiple", "Set aside: several chickens in one box"],
                           ["not_chicken", "Set aside: not a chicken"],
                           ["unsure", "Set aside: a hen, can't tell which"]].map(([k, title]) => `
    <div class="card" style="opacity:.85"><h3><span>${title}</span>
      <span class="meta">${S.aside[k].length} pieces · not counted for any chicken · click to put one back</span></h3>
    <div class="strip">${S.aside[k].map(f => `<img src="${img(f.crop)}" data-t="${f.track}" data-aside="${k}"
       class="${sel && sel.track === f.track ? "sel" : ""}" title="piece #${f.track}">`).join("") ||
       '<span class="meta">none yet</span>'}</div></div>`).join("");
  document.querySelectorAll(".card input").forEach(i => {
    i.addEventListener("change", () => api("api/name", { chicken: +i.dataset.id, name: i.value }));
    i.addEventListener("keydown", e => { if (e.key === "Enter") i.blur(); });
  });
  document.querySelectorAll("button[data-all]").forEach(b => b.addEventListener("click", () => {
    const c = S.chickens.find(c => c.id === +b.dataset.all), n = c.fragments.filter(f => !f.sure).length;
    if (confirm(`All ${n} unconfirmed pictures in this row are ${label(c)}?`)) api("api/confirm_all", { chicken: c.id });
  }));
  document.querySelectorAll("select[data-merge]").forEach(s => s.addEventListener("change", () => {
    if (!s.value) return;
    const src = S.chickens.find(c => c.id === +s.dataset.merge), dst = S.chickens.find(c => c.id === +s.value);
    if (confirm(`Merge "${label(src)}" into "${label(dst)}"?`)) api("api/merge", { src: src.id, dst: dst.id });
    else s.value = "";
  }));
  document.querySelectorAll(".strip img").forEach(im => im.addEventListener("click", () => {
    sel = { track: +im.dataset.t, chicken: im.dataset.c !== undefined ? +im.dataset.c : null,
            aside: im.dataset.aside || null, crop: im.getAttribute("src") };
    render(); showPanel();
  }));
  if (!sel) $("#panel").style.display = "none";
}

function showPanel() {
  const p = $("#panel"), cur = S.chickens.find(c => c.id === sel.chicken);
  const where = cur ? esc(label(cur)) : sel.aside === "multiple" ? "several chickens" : sel.aside === "unsure" ? "can't tell which hen" : "not a chicken";
  p.style.display = "block";
  p.innerHTML = `<img src="${sel.crop}"><div class="meta">piece #${sel.track}, now in <b>${where}</b></div>
    <div class="opts">
      ${cur ? `<button class="act yes" data-v="yes" data-c="${cur.id}">✓ correct</button>
               <button class="act" data-v="partial" data-c="${cur.id}">◐ only part of ${esc(label(cur))}</button>
               <button class="act" data-v="loose" data-c="${cur.id}">◑ mostly ${esc(label(cur))}, box too big</button>` : ""}
      ${S.chickens.filter(c => !cur || c.id !== cur.id).map(c =>
        `<button class="act" data-v="moved" data-c="${c.id}">→ ${esc(label(c))}</button>`).join("")}
      <button class="act" data-v="new">+ new chicken</button>
      ${sel.aside !== "multiple" ? '<button class="act no" data-v="multiple">several chickens</button>' : ""}
      ${sel.aside !== "not_chicken" ? '<button class="act no" data-v="not_chicken">not a chicken</button>' : ""}
      ${sel.aside !== "unsure" ? '<button class="act" data-v="unsure">can\'t tell which hen</button>' : ""}
      <button class="act" data-v="close">close</button></div>
    <div id="pfilm"><div class="meta">loading filmstrip…</div></div>`;
  fetch(`api/piece/${sel.track}`).then(r => r.json()).then(pc => {
    const box = p.querySelector("#pfilm");
    if (box && pc.strip) { box.innerHTML = `<div class="meta">whole piece (${pc.duration_s}s), ✂ to cut:</div>` + film(pc, 70); bindCuts(box); }
  });
  p.querySelectorAll("button").forEach(b => b.addEventListener("click", async () => {
    if (b.dataset.v === "close") { sel = null; return render(); }
    const t = sel.track; sel = null;
    await api("api/answer", { track: t, chicken: b.dataset.c ? +b.dataset.c : null, verdict: b.dataset.v });
  }));
}

// ---- marking: brush = an answer; paint filmstrip pictures; accept = cut where marks change + answer each part
const MARK_COLOURS = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#9085e9", "#e66767", "#008300"];
function markColour(k) {
  if (k.startsWith("c")) { const i = S.chickens.findIndex(c => `c${c.id}` === k); return MARK_COLOURS[i % MARK_COLOURS.length]; }
  return { unsure: "#9a9a95", not_chicken: "#555", multiple: "#6a5acd" }[k] || "#888";
}
const BOX_SIGN = { partial: " ◐ part", loose: " ◑ too big" };
const markName = k => { const [h, f] = k.split(":");
  return (h.startsWith("c") ? label(S.chickens.find(c => `c${c.id}` === h) || { id: +h.slice(1), name: "" })
                            : { unsure: "can't tell", not_chicken: "not a chicken", multiple: "several" }[h]) + (BOX_SIGN[f] || ""); };
function bindMarking(q) {
  // two layers: which bird (marks) and, on top, how good the box is (boxm: partial / loose)
  let brush = null, painting = false, marks = {}, boxm = {};
  const base = `c${q.chicken}`, pics = [...document.querySelectorAll(".paint .pic")];
  const final = f => { const h = marks[f] || base;  // box quality only means something for a hen
    return h.startsWith("c") && boxm[f] ? `${h}:${boxm[f]}` : h; };
  const show = () => {
    pics.forEach(p => { const f = p.dataset.f, on = !!(marks[f] || boxm[f]);
      p.classList.toggle("marked", on);
      p.classList.toggle("bpartial", boxm[f] === "partial"); p.classList.toggle("bloose", boxm[f] === "loose");
      p.style.setProperty("--mc", on ? markColour(marks[f] || base) : "transparent");
      p.querySelector(".tag").textContent = on ? markName(final(f)) : ""; });
    const seq = pics.map(p => final(p.dataset.f)), parts = seq.filter((k, i) => !i || k !== seq[i - 1]);
    const any = Object.keys(marks).length + Object.keys(boxm).length > 0;
    $("#markbar").style.display = any ? "flex" : "none";
    $("#mplan").textContent = parts.length > 1 ? `→ cut into ${parts.length} parts: ${parts.map(markName).join("  |  ")}`
                                               : `→ whole piece: ${markName(parts[0])}`;
    window._keys && (window._keys.enter = any ? accept : undefined);
  };
  const layer = () => brush.startsWith("box:") ? boxm : marks, val = () => brush.replace("box:", "");
  const paint = p => { if (!brush) return toast("First pick what to mark with (the buttons above the pictures)");
    layer()[p.dataset.f] = val(); show(); };
  document.querySelectorAll(".brush").forEach(b => b.onclick = () => {
    brush = brush === b.dataset.b ? null : b.dataset.b;
    document.querySelectorAll(".brush").forEach(x => x.classList.toggle("on", x.dataset.b === brush)); });
  pics.forEach(p => {
    p.onpointerdown = e => { e.preventDefault();
      if (brush && layer()[p.dataset.f] === val()) { delete layer()[p.dataset.f]; show(); return; }  // click again: unmark
      painting = true; paint(p); };
    p.onpointerenter = () => { if (painting) paint(p); };
  });
  window.onpointerup = () => { painting = false; };
  async function accept() {
    if (cutting) return toast("Still working — one moment…");
    cutting = true; toast("Cutting and answering…", 60000);
    try { if (await api("api/mark", { track: q.track, marks: pics.map(p => ({ frame: +p.dataset.f, label: final(p.dataset.f) })) }))
            toast("Done ✓"); }
    finally { cutting = false; }
  }
  $("#maccept").onclick = accept;
  $("#mreset").onclick = () => { marks = {}; boxm = {}; show(); };
  setTimeout(show);
}

// where were the hens while this piece was seen? rules hens out (seen elsewhere) and in (her dot was right here)
async function loadWhere(q) {
  const box = $("#where");
  let w;
  try { w = await (await fetch(`api/where/${q.track}?v=${S.version}`)).json(); } catch { box.innerHTML = ""; return; }
  if (!box.isConnected || S.next?.track !== q.track) return;  // moved on meanwhile
  const at = (x, before) => {
    if (!x) return `<span class="meta">${before ? "before" : "after"}: no trace</span>`;
    const where = before ? "where it starts" : "where it ends", b = x.bodies <= 0.5 ? "right at" : `${x.bodies} body lengths from`;
    const ago = x.age_s >= 60 ? "over a minute" : `${x.age_s}s`;
    const who = x.track == null ? "" : x.confirmed ? ` (#${x.track}, you confirmed)` : ` (#${x.track}, only the recogniser's guess)`;
    const txt = x.src === "S" ? `seen ${b} ${where}${x.later ? ` ${x.age_s}s later` : ""}${who}`
              : x.src === "F" ? `her moving pixels led ${b} ${where} (${ago} after last seen)`
              : `not seen for ${ago}; last seen ${b} ${where}`;
    const cls = x.bodies > 1.5 ? "meta" : x.strength === "strong" ? "hit" : x.strength === "weak" ? "weak" : "meta";
    return `<span class="${cls}">${before ? "before" : "after"}: ${txt}</span>`;
  };
  const rows = w.hens.map(h => {
    const tag = h.fits === "no" ? `<span class="wtag no">✗ ruled out</span>` : h.fits === "yes" ? `<span class="wtag yes">✓ fits</span>`
              : h.fits === "near" ? `<span class="wtag near">≈ was near earlier</span>` : `<span class="wtag">? no sign</span>`;
    const why = h.fits === "no" ? `<span class="meta">seen elsewhere for ${h.elsewhere_s}s of this piece (${h.elsewhere_tracks.map(t => "#" + t).join(", ")})</span>`
              : w.has_dots ? `${at(h.before, true)}<br>${at(h.after, false)}` : `<span class="meta">—</span>`;
    return `<div class="wrow ${h.fits}"><span class="dot" style="background:${markColour("c" + h.chicken)}"></span>
      <b>${esc(h.name)}</b>${h.asked ? ` <span class="meta">(asked)</span>` : ""} ${tag}<div class="wwhy">${why}</div></div>`;
  }).join("");
  const fits = w.hens.filter(h => h.fits === "yes"), out = w.hens.filter(h => h.fits === "no"), near = w.hens.filter(h => h.fits === "near");
  const age = h => Math.min(...[h.before, h.after].filter(x => x && x.bodies <= 1.5).map(x => x.age_s));
  let verdict;
  if (!w.has_dots) verdict = out.length ? `Ruled out: <b>${out.map(h => esc(h.name)).join(", ")}</b> (seen elsewhere at the same time).` : "No hen is seen elsewhere at the same time.";
  else if (fits.length === 1) {
    const guess = [fits[0].before, fits[0].after].some(x => x && x.src === "S" && x.confirmed === false)
                  && ![fits[0].before, fits[0].after].some(x => x && x.confirmed);
    verdict = `Only <b>${esc(fits[0].name)}</b> fits${fits[0].asked ? " — the one asked" : ""}` +
              (guess ? ` — but that's from a piece only the recogniser named, not you; check it` : "") + ".";
  }
  else if (fits.length > 1) verdict = `${fits.map(h => `<b>${esc(h.name)}</b>`).join(" and ")} were both right here — positions can't tell them apart; go by the look or play it.`;
  else if (near.length) verdict = `No hen was clearly here. Last seen near this spot: ${near.map(h => `<b>${esc(h.name)}</b> (${age(h) >= 60 ? "over a minute" : age(h) + "s"} before)`).join(", ")}${near.length > 1 ? " — a spot hens go in and out of, so positions can't decide; go by the look" : " — weak evidence (a while ago)"}.`;
  else verdict = `No hen's dot was near this piece${out.length ? ` and ${out.map(h => esc(h.name)).join(", ")} ${out.length > 1 ? "were" : "was"} elsewhere` : ""} — a hen coming into view here, or maybe not a chicken.`;
  const ill = (w.illegal || []).map(e => `<div class="warn">⚠ ${esc(e.detail)}</div>`).join("");
  const px = w.pixels, pxLine = !px ? "" : px.splits.length
    ? px.splits.map((e, k) => `<div class="warn">🔬 At ${e.clock} the box left the bird it was on — in 1 s it moved ${e.bodies} body lengths
        away from where her pixels went (switched to another bird?) <button class="act pxcut" data-k="${k}">✂ Cut here</button>
        <button class="act pxsee" data-k="${k}">▶ see it</button></div>`).join("")
    : px.checked ? `<div class="meta">🔬 Pixels: the box stays on the same bird in all ${px.checked} one-second checks ✓</div>` : "";
  const dotsLine = w.updating ? `<span class="meta">⟳ updating positions after your last change…</span>`
    : w.computing ? `<span class="meta">⏳ following every hen's pixels through the video (3–6 min, once per clip)…</span>`
    : w.dots_error ? `<span class="warn">dots failed: ${esc(w.dots_error)}</span>`
    : w.has_dots ? `<span class="meta">positions as of ${w.dots_made} — they update by themselves after each answer</span>`
    : `<span class="meta">Positions before/after need every hen's dot — </span><button class="act" id="wcomp">follow every hen's pixels (3–6 min, once)</button>`;
  const old = box.querySelector("#wvid"), oldKids = [...(box.querySelector("#wvidbox")?.children || [])];  // keep a loaded video
  box.innerHTML = `<div class="whead">📍 Where were the hens? <span class="wverdict">${verdict}</span></div>${ill}${pxLine}
    ${w.has_dots ? `<div id="wvidbox">${WHERE_MODES}</div>` : ""}
    <div class="wrows">${rows}</div>
    <div class="answers" style="margin-top:4px">${fits.map(h => `<button class="act yes wuse" data-c="${h.chicken}">It's ${esc(h.name)}</button>`).join("")}
      ${dotsLine}</div>`;
  box.querySelectorAll(".wuse").forEach(b => b.onclick = () => api("api/answer", { track: q.track, chicken: +b.dataset.c,
                                                                                  verdict: +b.dataset.c === q.chicken ? "yes" : "moved" }));
  const start = async e => { e && e.preventDefault(); await fetch("api/dots", { method: "POST", body: "{}" }); loadWhere(q); };
  $("#wcomp") && ($("#wcomp").onclick = start);
  box.querySelectorAll(".pxcut").forEach(b => b.onclick = async () => {
    if (cutting) return; cutting = true; toast("Cutting…", 20000);
    try { if (await api("api/split", { track: q.track, frame: px.splits[+b.dataset.k].cut_frame })) toast("Cut ✓ — both parts get asked again if unsure"); }
    finally { cutting = false; } });
  box.querySelectorAll(".pxsee").forEach(b => b.onclick = async () => {
    if (!$("#wvid")) { whereWide = false; await loadWhereVideo(q, w); }  // make the close-up first
    const v = $("#wvid"); if (!v) return;
    // close-up starts 3 s before the piece at real speed; wide starts 60 s before at 4x: jump to just before the switch
    const wide = v.dataset.wide === "true", pad = wide ? 60 : 3, k = wide ? 4 : 1;
    v.currentTime = Math.max(0, (px.splits[+b.dataset.k].at_s - Math.max(0, q.start - pad) - k) / k);
    v.playbackRate = wide ? 0.25 : 0.5; v.play(); });
  if (w.computing || w.updating) setTimeout(() => loadWhere(q), w.updating ? 2000 : 5000);
  if (!w.has_dots) return;
  if (old && old.dataset.t == q.track && old.dataset.d === w.dots_made && old.dataset.wide === String(whereWide)) {
    $("#wvidbox").replaceChildren(...oldKids); bindWhereMode(q, w); return; }
  bindWhereMode(q, w);  // videos are only made when one of the two buttons is clicked
}

let whereWide = false;
const WHERE_MODES = `<div class="answers" style="margin:2px 0 4px">
      <button class="act wmode" data-wide="0">▶ Close-up: 3 s before → 3 s after, real speed</button>
      <button class="act wmode" data-wide="1">⏩ Wide: 1 min before → 1 min after, 4× fast, with trails</button></div>`;
function bindWhereMode(q, w) {
  const v = $("#wvid");
  document.querySelectorAll(".wmode").forEach(b => {
    b.classList.toggle("on", !!v && (b.dataset.wide === "1") === whereWide);
    b.onclick = () => { whereWide = b.dataset.wide === "1"; loadWhereVideo(q, w); };
  });
}
async function loadWhereVideo(q, w) {
  const box = $("#wvidbox"); if (!box) return;
  const modes = WHERE_MODES;
  box.innerHTML = modes + `<div class="meta" id="wvidmsg">⏳ making the ${whereWide ? "wide 4× video (takes ~10–30 s)" : "video"}…</div>`;
  bindWhereMode(q, w);
  const wide = whereWide;
  try {
    const r = await fetch(`where/${q.track}.mp4?v=${S.version}&d=${encodeURIComponent(w.dots_made)}${wide ? "&wide=1" : ""}`);
    if (!r.ok) throw new Error();
    const blob = await r.blob();
    if (!$("#wvidbox") || S.next?.track !== q.track || wide !== whereWide) return;
    const v = document.createElement("video");
    Object.assign(v, { id: "wvid", controls: true, loop: true, muted: true, autoplay: true, playsInline: true });
    v.dataset.t = q.track; v.dataset.d = w.dots_made; v.dataset.wide = String(wide); v.src = URL.createObjectURL(blob);
    v.style.cssText = "max-width:100%;max-height:340px;border-radius:6px;background:#000;display:block;margin:4px 0 6px";
    const legend = document.createElement("div");
    legend.className = "meta";
    legend.innerHTML = (wide ? `yellow box = this piece · each hen's dot pulls a trail of her last 6 s · bar at the bottom: yellow = this piece, white = now · `
                             : `yellow box = this piece · ● hen seen · ◯ moving with her pixels · faint ring = not seen, waiting where last seen · `)
      + `speed ${[0.25, 0.5, 1].map(r => `<button class="act spd" data-r="${r}" style="padding:1px 6px">${r}×</button>`).join(" ")}`;
    const m = document.createElement("div"); m.innerHTML = modes;
    box.replaceChildren(m.firstElementChild, v, legend);
    bindWhereMode(q, w);
    legend.querySelectorAll(".spd").forEach(b => b.onclick = () => { v.playbackRate = +b.dataset.r;
      legend.querySelectorAll(".spd").forEach(x => x.classList.toggle("on", x === b)); });
  } catch { $("#wvidmsg") && ($("#wvidmsg").textContent = "couldn't make the video"); }
}

// trace: follow the bird piece by piece backwards / forwards until a piece that's certain
async function showTrace(q, dir) {
  const box = $("#tracebox");
  box.style.display = "block"; box.innerHTML = `<div class="meta">tracing…</div>`;
  let tr;
  try { tr = await (await fetch(`api/trace/${q.track}?v=${S.version}`)).json(); } catch { box.innerHTML = ""; return toast("Trace failed", 5000); }
  const hops = tr[dir], back = dir === "back";
  const badge = h => h.by === "you" ? (h.sure ? "✓ you confirmed" : "you set aside")
                   : h.by === "recogniser" ? `🤖 ${Math.round(h.p * 100)}% sure`
                   : h.rec && h.p != null ? `guess · 🤖 says ${esc(h.rec)} ${Math.round(h.p * 100)}%` : "guess";
  const card = h => `<div class="tcard${h.sure ? " sure" : ""}${h.ambiguous ? " amb" : ""}">
      <img src="strip/${h.track}/${h.join_frame}.jpg?v=${S.version}" style="height:90px;display:block">
      <b>#${h.track} ${esc(h.name)}</b><div class="meta">${badge(h)}</div>
      <div class="meta">${h.gap_s}s gap${h.gap_s > 4 ? " (stayed put, not seen)" : ""} · ${h.dist_bodies <= 0.5 ? "same spot" : `${h.dist_bodies} body lengths away`}${h.dist_bodies > 2 ? " ⚠ far" : ""}</div>
      ${h.ambiguous ? `<div class="meta warn">⚠ could also be #${h.alt} ${esc(h.alt_name || "")}</div>` : ""}</div>`;
  const me = `<div class="tcard me"><img src="strip/${q.track}/${q.strip[back ? 0 : q.strip.length - 1]}.jpg?v=${S.version}" style="height:90px;display:block">
      <b>this piece</b><div class="meta">#${q.track}, asking: ${esc(q.name)}?</div></div>`;
  const arrow = `<div class="tarrow">→</div>`;
  const anchor = hops.find(h => h.anchor), names = new Set(hops.filter(h => h.chicken != null).map(h => h.name));
  const amb = hops.some(h => h.ambiguous), far = hops.some(h => h.dist_bodies > 2);
  let verdict;
  if (!hops.length) verdict = `<b>Nothing links ${back ? "before" : "after"} this piece</b> — no bird ${back ? "left off" : "picked up"} nearby within 4 s, or in the same spot within 30 s. She ${back ? "comes into view" : "leaves the view"} here (or from behind something), so tracing can't help — play the piece instead.`;
  else if (!anchor) verdict = `Followed ${hops.length} step${hops.length > 1 ? "s" : ""} without reaching a piece that's certain.`;
  else verdict = `${back ? "Comes from" : "Goes on to"} <b>${esc(anchor.name)}</b> (${badge(anchor)}) in ${hops.length} step${hops.length > 1 ? "s" : ""}` +
                 (amb || far || names.size > 1 ? " — but check: " + [amb && "another bird was close at a link", far && "a long jump",
                   names.size > 1 && "the names along the way disagree"].filter(Boolean).join(", ") : " — a clean link.");
  const row = back ? [...hops].reverse().map(card).concat(me) : [me, ...hops.map(card)];
  box.innerHTML = `<div class="meta" style="margin-bottom:4px">${back ? "⏪ Back in time" : "Forward in time ⏩"}: ${verdict}</div>
    <div class="trow">${row.join(arrow)}</div>
    <div class="answers" style="margin-top:4px">
      ${hops.length ? `<button class="act" id="tplay">▶ Play the chain</button>` : ""}
      ${anchor && anchor.chicken != null ? `<button class="act yes" id="tuse">It's ${esc(anchor.name)}</button>` : ""}
      <button class="act" id="tclose">close</button></div>`;
  $("#tclose").onclick = () => { box.style.display = "none"; };
  $("#tplay") && ($("#tplay").onclick = () => playPiece(q.track, dir));
  $("#tuse") && ($("#tuse").onclick = () => api("api/answer", { track: q.track, chicken: anchor.chicken,
                                                         verdict: anchor.chicken === q.chicken ? "yes" : "moved" }));
}

// a short video of the piece, made on the server; loaded as a blob so every browser can seek in it
async function playPiece(track, dir = "") {
  const box = $("#clipbox"), v = $("#clipv"), key = `${track}${dir}`;
  if (box.style.display !== "none" && v.dataset.t == key) { v.paused ? v.play() : v.pause(); return; }
  toast(dir ? "Making the video of the whole chain…" : "Making the clip…", 60000);
  $("#play").textContent = "⏳ making the clip…";
  try {
    const r = await fetch(`clip/${track}.mp4?v=${S.version}${dir ? `&dir=${dir}` : ""}`);
    if (!r.ok) throw new Error();
    if (v.src) URL.revokeObjectURL(v.src);
    v.src = URL.createObjectURL(await r.blob()); v.dataset.t = key; toast("Playing ▶", 800);
    box.style.display = "block"; v.play();
    document.querySelectorAll(".spd").forEach(b => b.onclick = () => { v.playbackRate = +b.dataset.r;
      document.querySelectorAll(".spd").forEach(x => x.classList.toggle("on", x === b)); });
  } catch { toast("Couldn't make the clip", 5000); }
  finally { $("#play") && ($("#play").innerHTML = "▶ Play this piece <kbd>V</kbd>"); }
}

          ${others.map(c => `<button class="act" data-t="${p.track}" data-v="moved" data-c="${c.id}">→ ${esc(label(c))}</button>`).join("")}
          <button class="act" data-t="${p.track}" data-v="new">+ new chicken</button>
          <button class="act no" data-t="${p.track}" data-v="multiple">several chickens</button>
          <button class="act no" data-t="${p.track}" data-v="not_chicken">not a chicken</button>
          <button class="act" data-t="${p.track}" data-v="unsure">can't tell which hen</button>
        </div></div>`).join("")}</div>`;
  document.querySelectorAll("#main button[data-t]").forEach(b => b.onclick = () =>
    api("api/answer", { track: +b.dataset.t, chicken: b.dataset.c ? +b.dataset.c : null, verdict: b.dataset.v }));
  document.querySelectorAll("#main button[data-iso]").forEach(b => b.onclick = async () => {
    toast("Cutting out the overlap…");
    await api("api/isolate", { track: +b.dataset.iso, other: +b.dataset.other });
    toast("Done ✂ — now label the overlapping bit");
  });
  bindCuts();
}

let selCheck = null;
async function renderChecks() {
  $("#panel").style.display = "none"; window._keys = null;
  if (!S.checks) { $("#main").innerHTML = `<div class="card"><h3>No checks left 🎉</h3>
    <div class="meta">Nothing suspicious found: no set-aside piece that's really one bird, no named piece with a
    two-bird box, no piece that changes look part-way.</div></div>`; return; }
  let c = S.check;
  if (selCheck && selCheck !== c.key) {
    const r = await (await fetch("api/check/" + encodeURIComponent(selCheck))).json();
    if (!r.error) c = r; else selCheck = null;
  }
  const KIND = { aside_single: "Set aside, but one bird", merged_inside: "Two birds in a named box", swap: "Possible bird swap", recognizer: "Recogniser disagrees", stretch: "Part of the piece is another bird" };
  $("#main").innerHTML = `
    <div class="hint">Automatic checks for mistakes the conflicts and questions can't see. Look at the frames
      (yellow = the stretch in question) and either apply the suggested fix or mark it as fine.
      Everything is undoable (⌘Z).</div>
    <div class="card"><h3><span style="color:#ffb74d">${KIND[c.kind]}</span>
      <span class="meta">${c.seconds}s affected</span></h3>
      <div style="font-size:16px;margin:4px 0 10px">${esc(c.title)}</div>
      <div class="film">${c.strip.map((f, i) => `<img src="strip/${c.track}/${f}.jpg?v=${S.version}"
         style="height:110px;margin:2px;border:3px solid ${c.in_range[i] ? "#ffb74d" : "transparent"}">`).join("")}</div>
      <div class="answers">
        <button class="act yes" id="kapply">✓ Apply fix: ${esc(c.fix)}</button>
        <button class="act" id="kok">Looks fine — dismiss</button>
        <button class="act" id="kskip">Skip for now</button>
      </div></div>
    <div class="card"><h3>All checks <span class="meta">(${S.checks}, biggest first — click to open)</span></h3>
      ${S.check_list.map(x => `<div class="moment" data-k="${esc(x.key)}" style="display:flex;gap:10px;padding:5px;cursor:pointer;
        border-radius:6px;${x.key === c.key ? "background:#2a2a2a" : ""}"><span class="meta" style="width:60px">${x.seconds}s</span>
        <span>${esc(x.title)}</span></div>`).join("")}</div>`;
  $("#kapply").onclick = async () => { toast("Applying… (cutting, new pictures)"); selCheck = null;
    await api("api/apply_check", { key: c.key }); toast("Fixed ✓"); };
  $("#kok").onclick = () => { selCheck = null; api("api/dismiss_check", { key: c.key }); };
  $("#kskip").onclick = () => { const i = S.check_list.findIndex(x => x.key === c.key);
    selCheck = (S.check_list[i + 1] || S.check_list[0]).key; renderChecks(); };
  document.querySelectorAll(".moment[data-k]").forEach(el => el.onclick = () => { selCheck = el.dataset.k; renderChecks(); });
}

window.addEventListener("keydown", e => {
  const z = $("#zoom");
  if (z && z.style.display === "flex") { if (e.key === "Escape") closeGap(); return; }  // no answer keys while zoomed
  if (tab !== "ask" || e.target.tagName === "INPUT" || !window._keys) return;
  const f = window._keys[e.key.toLowerCase()]; if (f) { e.preventDefault(); if (!"vbf".includes(e.key.toLowerCase())) window._keys = null; f(); }
});
document.querySelectorAll(".tab").forEach(b => b.onclick = () => { tab = b.dataset.tab; sel = null;
  history.replaceState(null, "", "#" + tab); render(); });
async function undo() {
  if (!S.undo.count) return toast("Nothing to undo");
  sel = null;
  await api("api/undo", {});
  if (S.undone) toast(`Undone: ${S.undone}`);
}
$("#undo").onclick = undo;
window.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z" && e.target.tagName !== "INPUT") { e.preventDefault(); undo(); }
});
$("#resort").onclick = async () => { $("#resort").disabled = true; await api("api/resort", {}); $("#resort").disabled = false;
                                     toast("Re-sorted"); };
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);
api("api/state");
</script>
</body>
</html>
