<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Is this a chicken?</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #141414; color: #eee; font: 14px/1.4 system-ui, sans-serif;
         display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; gap: 18px; align-items: center; padding: 8px 14px; background: #1f1f1f;
           flex-wrap: wrap; }
  header .q { font-size: 18px; font-weight: 600; }
  .keys span { margin-right: 12px; color: #bbb; }
  kbd { background: #333; border: 1px solid #555; border-radius: 4px; padding: 0 6px; color: #fff; }
  .right { margin-left: auto; text-align: right; color: #bbb; }
  #bar { height: 4px; background: #333; }
  #bar div { height: 100%; background: #4caf50; width: 0; transition: width .2s; }
  #wrap { flex: 1; display: flex; justify-content: center; align-items: center; min-height: 0; padding: 8px; }
  canvas { max-width: 100%; max-height: 100%; cursor: crosshair; }
  .legend i { display: inline-block; width: 12px; height: 12px; margin: 0 4px -1px 10px; border-radius: 2px; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #333;
           padding: 8px 16px; border-radius: 6px; opacity: 0; transition: opacity .3s; }
</style>
</head>
<body>
<header>
  <div class="q">Is every chicken boxed — and only chickens?</div>
  <div class="keys">
    <span><kbd>Y</kbd>/<kbd>Enter</kbd> yes, save</span>
    <span><kbd>N</kbd> no chickens</span>
    <span>click box = toggle</span>
    <span>drag = add chicken</span>
    <span><kbd>Z</kbd> undo add</span>
    <span><kbd>S</kbd> unsure, skip</span>
    <span><kbd>←</kbd><kbd>→</kbd> browse</span>
  </div>
  <div class="legend"><i style="background:#ffc107"></i>suggested<i style="background:#4caf50"></i>chicken<i style="background:#f44336"></i>not a chicken</div>
  <div class="right"><div id="prog"></div><div id="meta"></div></div>
</header>
<div id="bar"><div></div></div>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="toast"></div>
<script>
const COLORS = { pending: "#ffc107", yes: "#4caf50", no: "#f44336" };
const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
let items = [], idx = 0, img = new Image(), boxes = [], drag = null, counts = {};

async function load() {
  const r = await (await fetch("/api/items")).json();
  items = r.items; counts = r.counts;
  const first = items.findIndex(it => it.status === "pending");
  show(first >= 0 ? first : 0);
}

function show(i) {
  idx = Math.max(0, Math.min(items.length - 1, i));
  const it = items[idx];
  if (it.status === "pending") {
    boxes = it.proposals.map(p => ({ b: p.slice(0, 4), conf: p[4], state: "pending" }));
  } else {
    boxes = it.boxes.map(b => ({ b, state: "yes", user: true }));
  }
  img = new Image();
  img.onload = () => { canvas.width = img.naturalWidth; canvas.height = img.naturalHeight; draw(); };
  img.src = "/img/" + encodeURIComponent(it.name);
  const done = counts.done + counts.skipped, total = items.length;
  document.getElementById("prog").textContent = `${done} / ${total} reviewed · frame ${idx + 1}`;
  document.querySelector("#bar div").style.width = (100 * done / total) + "%";
  const t = Math.round(it.time_s), mm = String(Math.floor(t / 60)).padStart(2, "0"), ss = String(t % 60).padStart(2, "0");
  document.getElementById("meta").textContent =
    `${it.video.split("/").pop()} @ ${mm}:${ss} · ${it.status}`;
}

function draw() {
  ctx.drawImage(img, 0, 0);
  const lw = Math.max(2, canvas.width / 500), fs = Math.max(14, canvas.width / 70);
  ctx.font = `bold ${fs}px system-ui`;
  for (const bx of boxes) {
    const [x1, y1, x2, y2] = bx.b;
    ctx.lineWidth = lw; ctx.strokeStyle = COLORS[bx.state];
    ctx.setLineDash(bx.state === "pending" ? [lw * 4, lw * 2] : []);
    ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
    if (bx.state === "no") {
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.moveTo(x2, y1); ctx.lineTo(x1, y2); ctx.stroke();
    }
    if (bx.conf !== undefined && bx.state === "pending") {
      ctx.fillStyle = COLORS.pending; ctx.fillText(Math.round(bx.conf * 100) + "%", x1, y1 - 4);
    }
  }
  ctx.setLineDash([]);
  if (drag && drag.moved) {
    ctx.strokeStyle = COLORS.yes; ctx.lineWidth = lw;
    ctx.strokeRect(drag.x0, drag.y0, drag.x - drag.x0, drag.y - drag.y0);
  }
}

function pos(e) {
  const r = canvas.getBoundingClientRect();
  return [(e.clientX - r.left) * canvas.width / r.width, (e.clientY - r.top) * canvas.height / r.height];
}

canvas.addEventListener("mousedown", e => { const [x, y] = pos(e); drag = { x0: x, y0: y, x, y, moved: false }; });
window.addEventListener("mousemove", e => {
  if (!drag) return;
  const [x, y] = pos(e); drag.x = x; drag.y = y;
  if (Math.hypot(x - drag.x0, y - drag.y0) > canvas.width / 200) drag.moved = true;
  draw();
});
window.addEventListener("mouseup", e => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.moved) {
    const b = [Math.min(d.x0, d.x), Math.min(d.y0, d.y), Math.max(d.x0, d.x), Math.max(d.y0, d.y)]
      .map(v => Math.max(0, v));
    b[2] = Math.min(b[2], canvas.width); b[3] = Math.min(b[3], canvas.height);
    boxes.push({ b, state: "yes", user: true });
  } else {
    // click: toggle the smallest box under the cursor
    const hits = boxes.filter(bx => d.x0 >= bx.b[0] && d.x0 <= bx.b[2] && d.y0 >= bx.b[1] && d.y0 <= bx.b[3])
      .sort((a, b) => area(a.b) - area(b.b));
    if (hits.length) hits[0].state = hits[0].state === "no" ? "yes" : "no";
  }
  draw();
});
const area = b => (b[2] - b[0]) * (b[3] - b[1]);

async function save(status, keep) {
  const it = items[idx];
  const kept = keep ? boxes.filter(bx => bx.state !== "no").map(bx => bx.b) : [];
  const r = await (await fetch("/api/item/" + encodeURIComponent(it.name), {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ status, boxes: kept }),
  })).json();
  it.status = status; it.boxes = kept; counts = r.counts;
  toast(status === "skipped" ? "skipped" : `saved · ${kept.length} chicken${kept.length === 1 ? "" : "s"}`);
  const next = items.findIndex((x, j) => j > idx && x.status === "pending");
  if (next >= 0) show(next);
  else { const any = items.findIndex(x => x.status === "pending"); any >= 0 ? show(any) : (show(idx), toast("All frames reviewed 🎉 — close this tab and run train")); }
}

let tt;
function toast(msg) {
  const t = document.getElementById("toast"); t.textContent = msg; t.style.opacity = 1;
  clearTimeout(tt); tt = setTimeout(() => t.style.opacity = 0, 1200);
}

window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k === "y" || k === "enter") save("done", true);
  else if (k === "n") save("done", false);
  else if (k === "s") save("skipped", false);
  else if (k === "z") { const i = boxes.map(b => !!b.user).lastIndexOf(true); if (i >= 0) { boxes.splice(i, 1); draw(); } }
  else if (k === "arrowright") show(idx + 1);
  else if (k === "arrowleft") show(idx - 1);
  else return;
  e.preventDefault();
});

load();
</script>
</body>
</html>
