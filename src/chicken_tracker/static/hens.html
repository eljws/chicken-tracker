<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hens — every picture</title>
<style>
  :root { --Monster: #3987e5; --Ginger: #d95926; --Rocky: #199e70; --Salt: #c98500; --Pepper: #d55181; --aside: #9a9a95; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #141414; color: #eee; font: 14px/1.4 system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: #1f1f1f; border-bottom: 1px solid #333; padding: 8px 16px; }
  header .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 3px 0; }
  h1 { font-size: 18px; margin: 0 10px 0 0; font-weight: 600; }
  .lbl { color: #999; font-size: 12px; min-width: 64px; }
  button.c { background: #2d2d2d; color: #ddd; border: 1px solid #555; border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
  button.c:hover { background: #3a3a3a; }
  button.c.on { background: #4a4a4a; color: #fff; outline: 2px solid #ffc107; font-weight: 600; }
  button.hen { border-left: 6px solid var(--hc) !important; }
  .muted { color: #999; font-size: 13px; }
  main { padding: 10px 16px 60px; }
  .cols { display: grid; gap: 10px; align-items: start; }
  .col { background: #1a1a1a; border: 1px solid #2c2c2c; border-radius: 8px; padding: 6px 8px; min-width: 0; }
  .col > h2 { margin: 0 0 4px; font-size: 16px; display: flex; gap: 8px; align-items: baseline; border-left: 6px solid var(--hc); padding-left: 8px; }
  .grp { margin: 6px 0 10px; }
  .grp h3 { margin: 0 0 4px; font-size: 13px; font-weight: 500; color: #ccc; display: flex; gap: 8px; align-items: baseline; }
  .pics { display: flex; flex-wrap: wrap; gap: 4px; }
  .pic { position: relative; width: var(--sz); height: var(--sz); background: #000; border-radius: 5px; border: 2px solid #333; cursor: pointer; overflow: hidden; }
  .pic img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .pic.sure { border-color: #4caf50; }
  .pic.partial { border-style: dashed; border-color: #ffb74d; } .pic.loose { border-style: dotted; border-color: #64b5f6; }
  .pic .b { position: absolute; left: 0; right: 0; bottom: 0; font-size: 10px; line-height: 1.35; text-align: center; color: #fff;
            background: color-mix(in srgb, var(--bc, #000) 80%, transparent); white-space: nowrap; overflow: hidden; }
  .pic.sel { outline: 3px solid #ffc107; }
  #pop { position: fixed; right: 14px; bottom: 14px; width: 560px; max-height: 86vh; overflow: auto; z-index: 10; display: none;
         background: #262626; border: 1px solid #555; border-radius: 10px; padding: 12px; box-shadow: 0 8px 30px #000a; }
  #pop .crops { display: flex; gap: 6px; } #pop .crops img { height: 120px; border-radius: 6px; background: #000; }
  #pop .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  #pop a { color: #8ab4f8; }
  .yes { background: #2e7d32 !important; border-color: #4caf50 !important; }
  .no { background: #8e2b2b !important; border-color: #e57373 !important; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #333; padding: 8px 16px; border-radius: 6px;
           opacity: 0; transition: opacity .3s; z-index: 20; }
  .key { display: inline-flex; gap: 10px; flex-wrap: wrap; }
  .key span { display: inline-flex; gap: 4px; align-items: center; }
  .sw { width: 14px; height: 14px; border-radius: 3px; border: 2px solid; display: inline-block; }
  button.c.br { border-left: 6px solid var(--hc, #888); } button.c.br.on { outline: 2px solid #ffc107; background: #4a4a4a; }
  body.painting .pic { cursor: crosshair; }
  .pic.painted { outline: 3px solid var(--pc, #fff); outline-offset: -3px; }
  .pic.painted.bpartial { outline-style: dashed; } .pic.painted.bloose { outline-style: dotted; }
  .pic .pt { position: absolute; left: 0; right: 0; top: 0; font-size: 10px; line-height: 1.35; text-align: center; color: #fff;
             background: color-mix(in srgb, var(--pc, #000) 85%, transparent); white-space: nowrap; overflow: hidden; pointer-events: none; }
  .pic .bot { position: absolute; right: 2px; top: 1px; font-size: 11px; pointer-events: none; }
  .sizes { max-width: 1100px; }
  .sizes h2 { font-size: 16px; font-weight: 600; margin: 18px 0 2px; } .sizes .sub { color: #999; font-size: 13px; margin-bottom: 8px; }
  .chart { background: #1d1d1d; border: 1px solid #2c2c2c; border-radius: 8px; padding: 10px; position: relative; }
  .chart svg { display: block; width: 100%; height: auto; }
  .chart text { fill: #999; font: 12px system-ui, sans-serif; } .chart .lab { fill: #ddd; font-weight: 600; }
  .chart .grid line { stroke: #2e2e2e; } .chart .axis { stroke: #555; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: #ccc; margin: 4px 0 6px; }
  .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
  #tip { position: absolute; pointer-events: none; background: #262626; border: 1px solid #555; border-radius: 6px; padding: 6px 9px;
         font-size: 12px; color: #ddd; display: none; white-space: nowrap; z-index: 5; }
  table.num { border-collapse: collapse; font-size: 13px; margin-top: 6px; } table.num td, table.num th { padding: 3px 10px; text-align: right; border-bottom: 1px solid #2a2a2a; }
  table.num th { color: #999; font-weight: 500; } table.num td:first-child, table.num th:first-child { text-align: left; }
</style>
</head>
<body>
<header>
  <div class="row"><h1>🐔 Hens</h1><button class="c" id="viewbtn"></button><span class="muted" id="sub">loading…</span>
    <span class="muted key" style="margin-left:auto">
      <span><i class="sw" style="border-color:#4caf50"></i>confirmed by you</span>
      <span><i class="sw" style="border-color:#555"></i>not confirmed</span>
      <span><i class="sw" style="border-color:#ffb74d;border-style:dashed"></i>only part</span>
      <span><i class="sw" style="border-color:#64b5f6;border-style:dotted"></i>box too big</span></span></div>
  <div class="row" id="palrow"><span class="lbl">Paint</span><span id="pal" class="row" style="margin:0"></span></div>
  <div class="row" id="pbar" style="display:none"><button class="c yes" id="papply"></button><span class="muted" id="pplan"></span>
    <button class="c" id="pclear">clear paint</button></div>
  <div class="row"><span class="lbl">Hens</span><span id="hens" class="row" style="margin:0"></span></div>
  <div class="row"><span class="lbl">Group by</span><span id="groups" class="row" style="margin:0"></span></div>
  <div class="row"><span class="lbl">Show</span><span id="shows" class="row" style="margin:0"></span>
    <span class="lbl" style="margin-left:14px;min-width:0">Day</span><span id="days" class="row" style="margin:0"></span>
    <span class="lbl" style="margin-left:14px;min-width:0">Size</span><input type="range" id="size" min="44" max="160" value="72"></div>
</header>
<main id="main"></main>
<div id="pop"></div>
<div id="toast"></div>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const css = getComputedStyle(document.documentElement);
const colour = h => css.getPropertyValue("--" + h).trim() || "#9a9a95";
const hhmm = s => `${String(Math.floor(s / 3600)).padStart(2, "0")}:${String(Math.floor(s / 60) % 60).padStart(2, "0")}`;
const hms = s => `${hhmm(s)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const dayOf = run => /^\d{4}-\d{2}-\d{2}/.test(run) ? run.slice(0, 10) : "other";  // a clip outside a day folder
const dayName = d => d === "other" ? "no date" : new Date(d + "T12:00").toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
function toast(m, ms = 1600) { const t = document.getElementById("toast"); t.textContent = m; t.style.opacity = 1; clearTimeout(t._t);
  t._t = setTimeout(() => t.style.opacity = 0, ms); }

const ASIDE = "Set aside";
const P = new URLSearchParams(location.hash.slice(1));
const V = { view: P.get("view") || "pictures", hen: P.get("hen") || "all", group: P.get("group") || "clip", show: P.get("show") || "all", day: P.get("day") || "all", size: +(P.get("size") || 72) };
let D = null, cur = null;
const save = () => history.replaceState(null, "", "#" + new URLSearchParams(V).toString());

// ---- groupings: each returns [key, title, sort order] for a piece
const SURE = p => p.sure ? [0, "✓ confirmed by you"] : p.rec && p.rec === p.hen ? [1, "named by the recogniser"] : [2, "guess (recogniser unsure or disagrees)"];
const ODD_B = [[0.12, "typical of her"], [0.2, "a bit unlike her"], [0.3, "unlike her"], [9, "very unlike her — look first"]];
const GROUPS = {
  clip: ["Day & clip", p => [p.run, `${dayName(dayOf(p.run))} · clip ${hhmm(p.clock_s - p.t)}`, p.run]],
  hour: ["Time of day", p => { const h = Math.floor(p.clock_s / 3600); return [h, `${String(h).padStart(2, "0")}:00–${String(h + 1).padStart(2, "0")}:00`, h]; }],
  sure: ["How sure", p => { const [k, n] = SURE(p); return [k, n, k]; }],
  box: ["Box", p => { const k = p.flag || "full"; return [k, { full: "whole hen in the box", partial: "◐ only part of her", loose: "◑ box too big" }[k], ["full", "partial", "loose"].indexOf(k)]; }],
  odd: ["Looks like her", p => { if (p.odd === undefined) return ["?", "no appearance data", 9];
    const i = ODD_B.findIndex(([x]) => p.odd < x); return [i, ODD_B[i][1], -i]; }],
  rec: ["Recogniser says", p => { const k = p.rec || "?"; return [k, p.rec ? `recogniser: ${p.rec}` : "no recogniser answer", p.rec === p.hen ? "0" : "1" + k]; }],
};
const SHOWS = { all: "everything", todo: "remaining (not confirmed)", doubt: "only doubtful (not confirmed, and unlike her or recogniser disagrees)",
                claude: "🤖 Claude's answers", ir: "🌙 infrared pieces (out of scope, hidden elsewhere)" };

async function load(keepScroll) {
  const y = scrollY;
  D = await (await fetch("api")).json();
  render();
  if (keepScroll) scrollTo(0, y);
}
function chip(id, k, label, on, extra = "") { return `<button class="c ${extra}" data-${id}="${esc(k)}" ${on ? "" : ""}>${label}</button>`; }
function controls() {
  const hens = [["all", "All side by side"], ...D.hens.map(h => [h, h]), [ASIDE, "Set aside"]];
  document.getElementById("hens").innerHTML = hens.map(([k, n]) =>
    `<button class="c ${k !== "all" ? "hen" : ""} ${V.hen === k ? "on" : ""}" data-hen="${esc(k)}" style="--hc:${k === ASIDE ? colour("aside") : colour(k)}">${esc(n)}
      <span class="muted">${k === "all" ? "" : count(k)}</span></button>`).join("");
  document.getElementById("groups").innerHTML = Object.entries(GROUPS).map(([k, [n]]) =>
    `<button class="c ${V.group === k ? "on" : ""}" data-group="${k}">${n}</button>`).join("");
  document.getElementById("shows").innerHTML = Object.entries(SHOWS).map(([k, n]) =>
    `<button class="c ${V.show === k ? "on" : ""}" data-show="${k}">${n}</button>`).join("");
  const days = [...new Set(D.pieces.map(p => dayOf(p.run)))].sort();
  document.getElementById("days").innerHTML = [["all", "all"], ...days.map(d => [d, dayName(d)])].map(([k, n]) =>
    `<button class="c ${V.day === k ? "on" : ""}" data-day="${k}">${n}</button>`).join("");
  document.querySelectorAll("header [data-hen],header [data-group],header [data-show],header [data-day]").forEach(b => b.onclick = () => {
    for (const k of ["hen", "group", "show", "day"]) if (b.dataset[k] !== undefined) V[k] = b.dataset[k];
    save(); render(); });
  const sz = document.getElementById("size"); sz.value = V.size;
  sz.oninput = () => { V.size = +sz.value; document.documentElement.style.setProperty("--sz", V.size + "px"); save(); };
  document.documentElement.style.setProperty("--sz", V.size + "px");
}
const doubtful = p => !p.sure && ((p.odd ?? 0) >= 0.2 || p.closer_to || (p.rec && p.hen && p.rec !== p.hen));
const visible = p => (V.day === "all" || dayOf(p.run) === V.day) && (V.show !== "claude" || p.claude) &&
  (V.show === "ir" ? p.ir : !p.ir) &&  // infrared (black-and-white) pieces: only in their own view
  (V.show === "all" || V.show === "claude" || V.show === "ir" || (V.show === "todo" && !p.sure) || (V.show === "doubt" && doubtful(p)));
const ofHen = h => p => h === ASIDE ? !p.hen : p.hen === h;
const count = h => D.pieces.filter(p => ofHen(h)(p) && visible(p)).length;

function render() {
  controls();
  const vb = document.getElementById("viewbtn");
  vb.textContent = V.view === "sizes" ? "🖼 Back to pictures" : "📏 Sizes";
  vb.onclick = () => { V.view = V.view === "sizes" ? "pictures" : "sizes"; save(); render(); };
  document.querySelectorAll("header .row:not(:first-child)").forEach(r => r.style.display = V.view === "sizes" ? "none" : "");
  if (V.view === "sizes") return renderSizes();
  const hens = V.hen === "all" ? D.hens : [V.hen];
  const ps = D.pieces.filter(visible);
  const n = ps.length, sure = ps.filter(p => p.sure).length;
  document.getElementById("sub").textContent = `${n} pieces shown from ${new Set(ps.map(p => p.run)).size} clips · ${sure} confirmed · one picture per piece · click one to look closer or fix it`;
  const side = hens.length > 1;
  const main = document.getElementById("main");
  main.innerHTML = `<div class="cols" style="grid-template-columns:repeat(${hens.length}, minmax(0, 1fr))">${hens.map(h => column(h, ps.filter(ofHen(h)), side)).join("")}</div>`;
  main.querySelectorAll(".pic").forEach(el => {
    el.onclick = () => { if (!PB.bird && !PB.box) open(+el.dataset.i); };
    el.onpointerdown = e => { if (!PB.bird && !PB.box) return; e.preventDefault(); pDrag = true; paint(+el.dataset.i, true); };
    el.onpointerenter = () => { if (pDrag) paint(+el.dataset.i, false); };
  });
  palette(); showPaint();
}

// ---- paint across clips: hold a Bird and/or a Box brush, click or drag pictures, Apply = one undo step per clip
const PB = { bird: null, box: null, marks: {} };  // marks: piece index -> {bird, box}
let pDrag = false, pErase = false;
addEventListener("pointerup", () => { pDrag = false; });
const PASIDE = [["multiple", "several"], ["not_chicken", "not a chicken"], ["unsure", "can't tell"]];
const PBOX = [["yes", "✓ right as is"], ["partial", "◐ only part of her"], ["loose", "◑ box too big"]];
function palette() {
  const el = document.getElementById("pal");
  el.innerHTML = D.hens.map((h, i) => `<button class="c br ${PB.bird === h ? "on" : ""}" data-pb="${esc(h)}" style="--hc:${colour(h)}">${esc(h)} <span class="muted">${i + 1}</span></button>`).join("") +
    PASIDE.map(([k, n]) => `<button class="c br ${PB.bird === k ? "on" : ""}" data-pb="${k}" style="--hc:#666">${n}</button>`).join("") +
    `<span class="lbl" style="min-width:0;margin-left:10px">Box</span>` +
    PBOX.map(([k, n]) => `<button class="c br ${PB.box === k ? "on" : ""}" data-px="${k}" style="--hc:#bbb">${n}</button>`).join("") +
    `<span class="muted" style="margin-left:8px">${PB.bird || PB.box ? "click or drag across pictures (any clip) · again to unpaint · Esc brushes down" : "pick a brush to paint; without one, click a picture for its menu"}</span>`;
  el.querySelectorAll("[data-pb]").forEach(b => b.onclick = () => { PB.bird = PB.bird === b.dataset.pb ? null : b.dataset.pb; palette(); });
  el.querySelectorAll("[data-px]").forEach(b => b.onclick = () => { PB.box = PB.box === b.dataset.px ? null : b.dataset.px; palette(); });
  document.body.classList.toggle("painting", !!(PB.bird || PB.box));
}
function paint(i, start) {
  const m = PB.marks[i] || {};
  if (start) pErase = (!PB.bird || m.bird === PB.bird) && (!PB.box || m.box === PB.box) && !!(m.bird || m.box);
  if (pErase) { if (PB.bird) delete m.bird; if (PB.box) delete m.box; } else { if (PB.bird) m.bird = PB.bird; if (PB.box) m.box = PB.box; }
  if (m.bird || m.box) PB.marks[i] = m; else delete PB.marks[i];
  showPaint();
}
function answerFor(i) {  // what Apply records for picture i on its own clip's naming page, or {skip: why}
  const p = D.pieces[i], m = PB.marks[i], ids = D.ids[p.run] || {};
  if (m.bird && !D.hens.includes(m.bird)) return { track: p.track, chicken: null, verdict: m.bird };
  const hen = m.bird || p.hen;
  if (!hen) return { skip: "a box mark needs a hen" };
  if (ids[hen] === undefined) return { skip: `${hen} has no row in that clip` };
  const verdict = m.box === "partial" || m.box === "loose" ? m.box : hen === p.hen ? "yes" : "moved";
  return { track: p.track, chicken: ids[hen], verdict };
}
const markLabel = m => (m.bird ? (PASIDE.find(([k]) => k === m.bird) || [0, m.bird])[1] : "") + (m.box === "partial" ? " ◐" : m.box === "loose" ? " ◑" : m.box === "yes" ? " ✓" : "");
function showPaint() {
  document.querySelectorAll(".pic").forEach(el => { const m = PB.marks[+el.dataset.i];
    el.classList.toggle("painted", !!m); el.classList.toggle("bpartial", m?.box === "partial"); el.classList.toggle("bloose", m?.box === "loose");
    el.style.setProperty("--pc", m ? (m.bird && D.hens.includes(m.bird) ? colour(m.bird) : m.bird ? "#666" : "#bbb") : "transparent");
    el.querySelector(".pt").textContent = m ? markLabel(m) : ""; });
  const idx = Object.keys(PB.marks).map(Number), runs = new Set(idx.map(i => D.pieces[i].run));
  const skip = idx.map(answerFor).filter(a => a.skip).length;
  document.getElementById("pbar").style.display = idx.length ? "flex" : "none";
  document.getElementById("papply").textContent = `✓ Apply ${idx.length} picture${idx.length === 1 ? "" : "s"} in ${runs.size} clip${runs.size === 1 ? "" : "s"}`;
  document.getElementById("pplan").textContent = skip ? `${skip} can't be applied (e.g. that hen has no row in its clip) and will be left as they are` : "one undo step per clip, on that clip's naming page";
}
document.getElementById("pclear").onclick = () => { PB.marks = {}; showPaint(); };
document.getElementById("papply").onclick = async () => {
  const by = {};
  for (const i of Object.keys(PB.marks).map(Number)) { const a = answerFor(i); if (a.skip) continue;
    (by[D.pieces[i].run] = by[D.pieces[i].run] || []).push(a); }
  let ok = 0, bad = [];
  for (const [run, answers] of Object.entries(by)) {
    const r = await fetch(`../run/${run}/naming/api/answers`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ answers }) });
    const j = await r.json().catch(() => ({ error: `error ${r.status}` }));
    if (j.error) bad.push(`${run}: ${j.error}`); else ok += answers.length;
  }
  PB.marks = {}; toast(bad.length ? `${ok} applied · problems: ${bad.join("; ")}` : `${ok} answers applied ✓ — undo per clip on its naming page`, bad.length ? 6000 : 2500);
  load(true);
};
addEventListener("keydown", e => {
  if (V.view === "sizes" || e.target.tagName === "INPUT") return;
  if (e.key === "Escape") { PB.bird = PB.box = null; palette(); }
  const i = "123456789".indexOf(e.key); if (i >= 0 && D && D.hens[i]) { PB.bird = PB.bird === D.hens[i] ? null : D.hens[i]; palette(); }
  if (e.key === "Enter" && Object.keys(PB.marks).length) document.getElementById("papply").click();
});
function column(h, ps, side) {
  const fn = GROUPS[V.group][1], g = new Map();
  for (const p of ps) { const [k, title, order] = h === ASIDE && V.group === "sure" ? [p.aside, p.aside, p.aside] : fn(p);
    if (!g.has(k)) g.set(k, { title, order, ps: [] }); g.get(k).ps.push(p); }
  const groups = [...g.values()].sort((a, b) => a.order < b.order ? -1 : a.order > b.order ? 1 : 0);
  const sortIn = V.group === "odd" ? (a, b) => (b.odd ?? 0) - (a.odd ?? 0) : (a, b) => a.clock_s - b.clock_s || a.run.localeCompare(b.run);
  const secs = ps.reduce((s, p) => s + p.duration_s, 0);
  return `<div class="col"><h2 style="--hc:${h === ASIDE ? colour("aside") : colour(h)}">${esc(h)}
      <span class="muted">${ps.length} pieces · ${(secs / 60).toFixed(0)} min · ${ps.filter(p => p.sure).length} confirmed</span></h2>
    ${groups.map(gr => `<div class="grp"><h3>${esc(gr.title)} <span class="muted">${gr.ps.length}</span></h3>
      <div class="pics">${gr.ps.sort(sortIn).map(pic).join("")}</div></div>`).join("") || '<div class="muted">nothing to show</div>'}</div>`;
}
function pic(p) {
  const i = D.pieces.indexOf(p);
  // hints only on pieces you haven't confirmed: once you've said who it is, a hint is just noise
  const badge = p.aside ? [p.aside, "#555"] : p.sure ? null : p.closer_to ? [`≈ ${p.closer_to}?`, colour(p.closer_to)]
    : p.rec && p.rec !== p.hen ? [`rec: ${p.rec}`, colour(p.rec)] : null;
  const tip = `${p.hen || p.aside} · ${dayName(dayOf(p.run))} ${hms(p.clock_s)} · ${p.duration_s}s · piece #${p.track}` +
    (p.sure ? " · confirmed" : "") + (p.rec ? ` · recogniser: ${p.rec} (${Math.round(p.rec_p * 100)}%)` : "") +
    (p.odd !== undefined ? ` · unlike her: ${p.odd.toFixed(2)}` : "") + (p.closer_to ? ` · looks closer to ${p.closer_to}` : "");
  return `<div class="pic ${p.sure ? "sure" : ""} ${p.flag || ""} ${cur === i ? "sel" : ""}" data-i="${i}" title="${esc(tip)}">
    <img loading="lazy" src="crop/${p.run}/${encodeURIComponent(p.crop)}" draggable="false">${badge ? `<span class="b" style="--bc:${badge[1]}">${esc(badge[0])}</span>` : ""}${p.claude ? '<span class="bot" title="answered by Claude">🤖</span>' : ""}${p.ir ? '<span class="bot" style="left:2px;right:auto" title="infrared (black-and-white): out of scope">🌙</span>' : ""}<span class="pt"></span></div>`;
}

function open(i) {
  cur = i; const p = D.pieces[i], ids = D.ids[p.run] || {}, pop = document.getElementById("pop");
  document.querySelectorAll(".pic.sel").forEach(x => x.classList.remove("sel"));
  document.querySelector(`.pic[data-i="${i}"]`)?.classList.add("sel");
  const here = p.hen ? ids[p.hen] : null;
  const hensHere = Object.keys(ids).filter(n => n !== p.hen);
  pop.style.display = "block";
  pop.innerHTML = `<div style="display:flex;gap:8px;align-items:baseline"><b style="font-size:16px">${esc(p.hen || p.aside)}</b>
      <span class="muted">${dayName(dayOf(p.run))} ${hms(p.clock_s)} · ${p.duration_s}s · piece #${p.track}${p.sure ? " · ✓ confirmed" : ""}</span>
      <button class="c" id="pclose" style="margin-left:auto">close</button></div>
    <div class="crops" style="margin-top:6px">${p.crops.map(c => `<img src="crop/${p.run}/${encodeURIComponent(c)}">`).join("")}</div>
    <div class="muted" style="margin-top:6px">${p.rec ? `Recogniser: <b>${esc(p.rec)}</b> (${Math.round(p.rec_p * 100)}%)` : "No recogniser answer"}${p.odd !== undefined ?
      ` · unlike ${esc(p.hen)}: ${p.odd.toFixed(2)} (0 = typical)` : ""}${p.closer_to ? ` · looks closer to <b>${esc(p.closer_to)}</b>` : ""}</div>
    <div class="acts">
      ${here !== undefined && here !== null ? `<button class="c yes" data-v="yes" data-c="${here}">✓ is ${esc(p.hen)}</button>
        <button class="c" data-v="partial" data-c="${here}">◐ only part of ${esc(p.hen)}</button>
        <button class="c" data-v="loose" data-c="${here}">◑ ${esc(p.hen)}, box too big</button>` : ""}
      ${hensHere.map(n => `<button class="c hen" style="--hc:${colour(n)}" data-v="moved" data-c="${ids[n]}">→ ${esc(n)}</button>`).join("")}
      <button class="c" data-v="unsure">can't tell which hen</button>
      <button class="c no" data-v="not_chicken">not a chicken</button>
      <button class="c no" data-v="multiple">several</button></div>
    <div class="muted" style="margin-top:8px">
      <a href="../run/${p.run}/naming/#name" target="_blank">open this clip's naming page</a> ·
      <a href="../run/${p.run}/player/#t=${p.pic_t ?? p.t}&piece=${p.track}&a=${p.t}&b=${(p.t + p.duration_s).toFixed(1)}${p.hen ? `&name=${encodeURIComponent(p.hen)}` : ""}"
         target="_blank" title="The piece gets a white box; a banner says when it starts and ends">🎬 open the footage at this picture (${hms(p.clock_s + ((p.pic_t ?? p.t) - p.t))})</a></div>`;
  pop.querySelector("#pclose").onclick = close;
  pop.querySelectorAll("button[data-v]").forEach(b => b.onclick = async () => {
    const body = { track: p.track, chicken: b.dataset.c !== undefined ? +b.dataset.c : null, verdict: b.dataset.v };
    const r = await fetch(`../run/${p.run}/naming/api/answer`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({ error: `error ${r.status}` }));
    if (j.error) return toast(j.error, 4000);
    toast(`Done ✓ — undo it on that clip's naming page (↶ Undo)`, 2500); close(); load(true);
  });
}
function close() { cur = null; document.getElementById("pop").style.display = "none"; document.querySelectorAll(".pic.sel").forEach(x => x.classList.remove("sel")); }
addEventListener("keydown", e => { if (e.key === "Escape") close(); });
// ---- sizes: how big each hen's box is, by distance from the camera and hen against hen
let SZ = null;
async function renderSizes(rebuild) {
  const main = document.getElementById("main");
  if (!SZ || rebuild) {
    main.innerHTML = `<div class="muted" style="padding:14px">${rebuild ? "Learning sizes from your current naming (about 10 s)…" : "loading…"}</div>`;
    const r = await fetch("sizes", rebuild ? { method: "POST" } : {});
    SZ = await r.json();
    if (SZ.error) { main.innerHTML = `<div class="muted" style="padding:14px">${esc(SZ.error)}</div>`; return; }
  }
  const C = SZ.cal, hens = Object.keys(C.hens);
  const built = new Date(C.built * 1000).toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  document.getElementById("sub").textContent = `${C.boxes.toLocaleString()} clean boxes of confirmed pieces from ${C.clips} clips · learned ${built}`;
  main.innerHTML = `<div class="sizes">
    ${SZ.stale ? `<div class="muted" style="color:#ffb74d">Naming has changed since these sizes were learned.
       <button class="c" id="rebuild">↻ Update from current naming</button></div>` : `<button class="c" id="rebuild" title="Learn again from your current naming">↻ Update</button>`}
    <h2>Box size by distance from the camera</h2>
    <div class="sub">Typical box side (pixels) of each hen, every half metre across the yard. Further away, the same hen looks smaller:
      box area ∝ (pixels per metre of ground)<sup>${C.b.toFixed(2)}</sup> — plain perspective would be 2.</div>
    <div class="legend">${hens.map(h => `<span><i style="background:${colour(h)}"></i>${esc(h)}</span>`).join("")}</div>
    <div class="chart" id="c1"><div id="tip"></div></div>
    <h2>Hen against hen</h2>
    <div class="sub">Usual box area of each hen at the same spot, against the average hen (1×). The bar is where half her boxes fall —
      she stands tall, pecks, turns side-on. The naming checks judge each hen's box against her own size.</div>
    <div class="chart" id="c2"></div>
    <h2>The numbers</h2>
    <table class="num"><tr><th>Hen</th><th>usual size</th><th>half her boxes</th><th>9 in 10 boxes</th><th>boxes measured</th></tr>
      ${hens.map(h => { const v = C.hens[h]; return `<tr><td><i class="sw" style="border-color:${colour(h)};width:8px;height:8px"></i> ${esc(h)}</td>
        <td>${v.factor.toFixed(2)}×</td><td>${(v.factor * v.p25).toFixed(2)}–${(v.factor * v.p75).toFixed(2)}×</td>
        <td>${(v.factor * v.p10).toFixed(2)}–${(v.factor * v.p90).toFixed(2)}×</td><td>${v.boxes.toLocaleString()}</td></tr>`; }).join("")}</table>
    <div class="sub" style="margin-top:8px">Learned only from boxes you confirmed, not flagged "only part" or "box too big", not overlapping another box,
      and not cut off by the picture edge. Distance is measured on the ground (patio-slab calibration) from the middle of the picture's bottom edge.</div>
  </div>`;
  document.getElementById("rebuild").onclick = () => renderSizes(true);
  lineChart(document.getElementById("c1"), C, hens);
  rangeChart(document.getElementById("c2"), C, hens);
}

function lineChart(box, C, hens) {
  const W = 1000, H = 380, L = 56, R = 80, T = 14, B = 40;
  const pts = hens.flatMap(h => C.curve[h].map(([m, side]) => [m, side]));
  const xmax = Math.ceil(Math.max(...pts.map(p => p[0]))), ymax = Math.ceil(Math.max(...pts.map(p => p[1])) / 20) * 20;
  const x = m => L + (W - L - R) * m / xmax, y = v => T + (H - T - B) * (1 - v / ymax);
  let g = `<g class="grid">`;
  for (let v = 0; v <= ymax; v += 20) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  for (let m = 0; m <= xmax; m += 1) g += `<text x="${x(m)}" y="${H - B + 18}" text-anchor="middle">${m}</text>`;
  g += `</g><line class="axis" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>
    <text x="${(L + W - R) / 2}" y="${H - 4}" text-anchor="middle">metres from the near edge of the picture</text>
    <text transform="translate(14 ${(T + H - B) / 2}) rotate(-90)" text-anchor="middle">box side (px)</text>`;
  const ends = [];
  for (const h of hens) {
    const c = C.curve[h]; if (!c.length) continue;
    g += `<polyline fill="none" stroke="${colour(h)}" stroke-width="2" stroke-linejoin="round" points="${c.map(([m, v]) => `${x(m)},${y(v)}`).join(" ")}"/>`;
    const [m, v] = c[c.length - 1]; ends.push([h, x(m), y(v)]);
  }
  ends.sort((a, b) => a[2] - b[2]);  // direct labels at line ends, nudged apart
  for (let i = 1; i < ends.length; i++) if (ends[i][2] - ends[i - 1][2] < 14) ends[i][2] = ends[i - 1][2] + 14;
  g += ends.map(([h, ex, ey]) => `<text class="lab" x="${ex + 6}" y="${ey + 4}">${esc(h)}</text>`).join("");
  g += `<line id="xh" y1="${T}" y2="${H - B}" stroke="#777" stroke-width="1" style="display:none"/><rect id="hit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/>`;
  box.insertAdjacentHTML("beforeend", `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`);
  const svg = box.querySelector("svg"), tip = box.querySelector("#tip"), xh = svg.querySelector("#xh");
  const bins = [...new Set(pts.map(p => p[0]))].sort((a, b) => a - b);
  svg.querySelector("#hit").onmousemove = e => {
    const r = svg.getBoundingClientRect(), mx = (e.clientX - r.left) * W / r.width;
    const m = bins.reduce((a, b) => Math.abs(x(b) - mx) < Math.abs(x(a) - mx) ? b : a);
    xh.setAttribute("x1", x(m)); xh.setAttribute("x2", x(m)); xh.style.display = "";
    const rows = hens.map(h => [h, C.curve[h].find(c => c[0] === m)]).filter(([, c]) => c).sort((a, b) => b[1][1] - a[1][1]);
    tip.innerHTML = `<b>${(m - 0.25).toFixed(1)}–${(m + 0.25).toFixed(1)} m</b><br>` + rows.map(([h, c]) =>
      `<span style="color:${colour(h)}">━</span> ${esc(h)} ${c[1]} px <span class="muted">(${c[2]} boxes)</span>`).join("<br>");
    tip.style.display = "block";
    const px = x(m) * r.width / W; tip.style.left = (px > r.width * 0.6 ? px - tip.offsetWidth - 12 : px + 14) + "px"; tip.style.top = "16px";
  };
  svg.querySelector("#hit").onmouseleave = () => { tip.style.display = "none"; xh.style.display = "none"; };
}

function rangeChart(box, C, hens) {
  const W = 1000, rowH = 34, L = 90, R = 40, T = 22, B = 30, H = T + B + rowH * hens.length;
  const vals = hens.flatMap(h => { const v = C.hens[h]; return [v.factor * v.p10, v.factor * v.p90]; });
  const xmax = Math.ceil(Math.max(...vals) * 4) / 4, x = v => L + (W - L - R) * v / xmax;
  let g = `<g class="grid">`;
  for (let v = 0; v <= xmax + 1e-9; v += 0.25) g += `<line x1="${x(v)}" x2="${x(v)}" y1="${T}" y2="${H - B}"/><text x="${x(v)}" y="${H - B + 16}" text-anchor="middle">${v.toFixed(2).replace(/0$/, "")}×</text>`;
  g += `</g><line x1="${x(1)}" x2="${x(1)}" y1="${T}" y2="${H - B}" stroke="#777" stroke-dasharray="3 3"/>
    <text x="${x(1)}" y="${T - 8}" text-anchor="middle">average hen</text>`;
  hens.forEach((h, i) => {
    const v = C.hens[h], cy = T + rowH * i + rowH / 2, col = colour(h);
    g += `<g><title>${h}: usual ${v.factor.toFixed(2)}× the average hen · half her boxes ${(v.factor * v.p25).toFixed(2)}–${(v.factor * v.p75).toFixed(2)}× · 9 in 10 ${(v.factor * v.p10).toFixed(2)}–${(v.factor * v.p90).toFixed(2)}×</title>
      <text class="lab" x="${L - 10}" y="${cy + 4}" text-anchor="end">${esc(h)}</text>
      <line x1="${x(v.factor * v.p10)}" x2="${x(v.factor * v.p90)}" y1="${cy}" y2="${cy}" stroke="${col}" stroke-width="2" stroke-opacity=".5"/>
      <rect x="${x(v.factor * v.p25)}" y="${cy - 7}" width="${x(v.factor * v.p75) - x(v.factor * v.p25)}" height="14" rx="4" fill="${col}" fill-opacity=".45"/>
      <circle cx="${x(v.factor)}" cy="${cy}" r="5" fill="${col}" stroke="#1d1d1d" stroke-width="2"/>
      <rect x="${L}" y="${cy - rowH / 2}" width="${W - L - R}" height="${rowH}" fill="transparent"/></g>`;
  });
  box.insertAdjacentHTML("beforeend", `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`);
}

load();
</script>
