[project]
name = "chicken-tracker"
version = "0.1.0"
description = "Per-chicken tracking and flock analytics from CCTV video"
authors = [
    { name = "Jakub Smykla", email = "jakubsmykla@aol.com" }
]
requires-python = ">=3.11"
dependencies = [
    "imageio-ffmpeg>=0.8.0",
    "lap>=0.5.13",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pandas>=3.1.0",
    "ultralytics>=8.4.197",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
chicken-tracker = "chicken_tracker.cli:main"
