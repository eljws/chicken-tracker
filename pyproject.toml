[project]
name = "chicken-tracker"
version = "0.1.0"
description = "Per-chicken tracking and flock analytics from CCTV video"
authors = [
    { name = "Jakub Smykla", email = "jakubsmykla@aol.com" }
]
requires-python = ">=3.11"
dependencies = [
    "coremltools>=9.0 ; sys_platform == 'darwin'",
    "imageio-ffmpeg>=0.8.0",
    "lap>=0.5.13",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pandas>=3.1.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "ultralytics>=8.4.197",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
chicken-tracker = "chicken_tracker.cli:main"

# On Linux (the Raspberry Pi) take PyTorch's CPU-only build: the default Linux wheels pull ~4 GB of NVIDIA
# CUDA libraries a Pi can't use. macOS keeps the normal build (it has the GPU/MPS support).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
